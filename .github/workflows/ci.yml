name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_secret
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/testdb
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — the migration-drift check below diffs
          # against the pre-push/PR-base commit, which a depth-1 checkout wouldn't have.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Generate SDK
        run: pnpm sdk:generate

      - name: Check SDK drift
        run: pnpm sdk:check

      # Catches the exact failure mode that caused this project's migrations folder to fall badly
      # out of sync with schema.prisma for a long time (schema.prisma edited, `db push` used to
      # ship it, no migration file ever written) — not by demanding the whole historical migration
      # set perfectly reconstructs the current schema (it doesn't, and reconciling years of that
      # retroactively is a separate cleanup, not something to gate every PR on), but by requiring
      # that *this* change carries its own migration if it touches schema.prisma at all. See
      # docs/deploy/database-migrations.md.
      - name: Check schema/migration drift
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against (e.g. a new branch's first push) — skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- packages/db/prisma/schema.prisma packages/db/prisma/migrations/)
          if echo "$CHANGED" | grep -qx "packages/db/prisma/schema.prisma"; then
            if ! echo "$CHANGED" | grep -qE "^packages/db/prisma/migrations/.+/migration\.sql$"; then
              echo "::error::schema.prisma changed but no new file under packages/db/prisma/migrations/ came with it. Run 'prisma migrate dev' to create a real migration — never ship a schema.prisma change on its own (db push does not leave a record other environments can replay)."
              exit 1
            fi
          fi

      # Catches what the type-check/lint/vitest steps above structurally cannot: vitest and `tsx
      # <file>` both run against this repo's own already-`pnpm install`-ed node_modules (real
      # pnpm workspace symlinks), so a package-specifier import that only breaks in the *built
      # Railway image's* node_modules layout resolves fine here and slips through everywhere
      # above. Confirmed live (2026-09-08): GoogleSheetsService.ts/ImportSourceService.ts's
      # `@project/sdk/src/lib/X` imports passed typecheck, lint, and the full vitest suite, then
      # crash-looped `server` in production for several minutes on MODULE_NOT_FOUND. This builds
      # each service's real Dockerfile and boots the real container against the same fresh mysql
      # service the rest of this job uses (before "Push DB schema" below, so `prisma migrate
      # deploy` inside the container runs against a genuinely empty schema — the same situation
      # as a real first deploy, not a database `db:push` already shaped for it), then polls
      # /health. See eslint.config.js's no-restricted-imports rule for the complementary,
      # cheaper check that catches the specific import *pattern*; this catches the failure mode
      # directly, regardless of what causes it.
      - name: Build and boot-check server images
        run: |
          set -e
          boot_check() {
            local name="$1" dockerfile="$2" port="$3"
            echo "::group::docker build ($name)"
            docker build -f "$dockerfile" -t "loopie-$name-ci" .
            echo "::endgroup::"
            docker run -d --name "$name-boot-check" --network host \
              -e DATABASE_URL="$DATABASE_URL" \
              -e NODE_ENV=production \
              -e PORT="$port" \
              "loopie-$name-ci"
            ok=""
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$port/health" > /dev/null; then
                ok=1
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$name-boot-check" 2>/dev/null)" != "true" ]; then
                echo "$name container exited before it ever answered /health."
                break
              fi
              sleep 2
            done
            echo "::group::$name container logs"
            docker logs "$name-boot-check" || true
            echo "::endgroup::"
            docker rm -f "$name-boot-check" > /dev/null 2>&1 || true
            if [ -z "$ok" ]; then
              echo "::error::$name did not answer 200 on /health within 60s of a real Docker boot."
              exit 1
            fi
            echo "$name booted and answered /health."
          }
          boot_check server apps/server/Dockerfile 3001
          boot_check ad-server apps/ad-server/Dockerfile 3002

      - name: Push DB schema
        run: pnpm db:push

      - name: Test
        run: pnpm test
