      summary: Record platform-reported ad spend
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordAdSpendInput' }
      responses:
        '201':
          description: Ad spend recorded against reserved campaign funds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdSpend' }

  /finance/ad-spend/{adSpendId}/settle:
    post:
      operationId: settleAdSpend
      summary: Settle a recorded ad spend
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/AdSpendId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettleAdSpendInput' }
      responses:
        '201':
          description: Settled amount stored separately from reported amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdSpend' }

  /finance/fees:
    post:
      operationId: recordLoopieFee
      summary: Record a LOOPIE management fee
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordFeeInput' }
      responses:
        '201':
          description: Fee posted to LOOPIE revenue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LedgerTransaction' }

  /finance/commissions:
    post:
      operationId: createCommission
      summary: Create a pending commission
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommissionInput' }
      responses:
        '201':
