openapi: 3.0.3
info:
  title: LOOPIE API
  version: 0.0.1
  description: >
    Unified messaging + advertising platform. Contract mirrors docs/00-unified-data-model.md:
    Campaign (paid) and Message (owned) are separate acquisition mechanisms that both feed one
    Contact -> Lead -> Sale -> Interaction spine via a source_type/source_id pointer.

servers:
  - url: http://localhost:3001
    description: Local dev

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      in: query
      name: q
      schema: { type: string, minLength: 1, maxLength: 200 }
    ContactId:
      in: path
      name: contactId
      required: true
      schema: { type: string }
    AudienceId:
      in: path
      name: audienceId
      required: true
      schema: { type: string }
    AssetId:
      in: path
      name: assetId
      required: true
      schema: { type: string }
    TemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string }
    CreativeId:
      in: path
      name: creativeId
      required: true
      schema: { type: string }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string }
    AutomationId:
      in: path
      name: automationId
      required: true
      schema: { type: string }
    AffiliateId:
      in: path
      name: affiliateId
      required: true
      schema: { type: string }
    AffiliateClassId:
      in: path
      name: classId
      required: true
      schema: { type: string }
    AffiliateDealId:
      in: path
      name: dealId
      required: true
      schema: { type: string }
    CampaignId:
      in: path
      name: campaignId
      required: true
      schema: { type: string }
    DeploymentId:
      in: path
      name: deploymentId
      required: true
      schema: { type: string }
    AdRunId:
      in: path
      name: adRunId
      required: true
      schema: { type: string }
    InboxThreadId:
      in: path
      name: threadId
      required: true
      schema: { type: string }
    AdvertisementId:
      in: path
      name: advertisementId
      required: true
      schema: { type: string }
    AdPlatform:
      in: path
      name: platform
      required: true
      schema: { type: string, enum: [META, GOOGLE, TIKTOK] }
    LeadId:
      in: path
      name: leadId
      required: true
      schema: { type: string }
    SaleId:
      in: path
      name: saleId
      required: true
      schema: { type: string }
    LandingPageTemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string }
    LandingPageId:
      in: path
      name: landingPageId
      required: true
      schema: { type: string }
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string }
    FormId:
      in: path
      name: formId
      required: true
      schema: { type: string }
    AdUnitId:
      in: path
      name: adUnitId
      required: true
      schema: { type: string }
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: { type: string }
    AdSpendId:
      in: path
      name: adSpendId
      required: true
      schema: { type: string }
    CommissionId:
      in: path
      name: commissionId
      required: true
      schema: { type: string }
    IntegrationId:
      in: path
      name: integrationId
      required: true
      schema: { type: string }
    CrmProviderParam:
      in: path
      name: provider
      required: true
      schema: { type: string, enum: [HUBSPOT, SALESFORCE, SHOPIFY, SQUARE, PIPEDRIVE] }
    ExternalRecordId:
      in: path
      name: recordId
      required: true
      schema: { type: string }
    ActivityId:
      in: path
      name: activityId
      required: true
      schema: { type: string }
    AttentionId:
      in: path
      name: attentionId
      required: true
      schema: { type: string }


  schemas:
    PaginatedMeta:
      type: object
      required: [hasMore, nextCursor]
      properties:
        hasMore: { type: boolean }
        nextCursor: { type: string, nullable: true }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    # ---------- Auth ----------
    User:
      type: object
      required: [id, email, businessId, role, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        businessId: { type: string }
        businessName: { type: string }
        role: { type: string, enum: [USER, ADMIN, AFFILIATE] }
        subscriptionStatus: { type: string, nullable: true }
        businessIdentityCompletedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Null until the business identity (docs/strategy/03-product-principles.md First-Login step 0) has been saved at least once — the frontend uses this to route a brand-new user to /business/setup before Inbox.',
          }
        createdAt: { type: string, format: date-time }

    RegisterInput:
      type: object
      required: [email, password, businessName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        businessName: { type: string, minLength: 1, maxLength: 120 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    SocialProfileLink:
      type: object
      required: [platform, url]
      properties:
        platform: { type: string, minLength: 1, maxLength: 40 }
        url: { type: string, minLength: 1, maxLength: 500 }

    Business:
      type: object
      required: [id, name, socialProfiles]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        targetAudience: { type: string, nullable: true }
        socialProfiles:
          type: array
          items: { $ref: '#/components/schemas/SocialProfileLink' }
        logoUrl: { type: string, nullable: true }
        identityCompletedAt: { type: string, format: date-time, nullable: true }

    UpdateBusinessInput:
      type: object
      description: 'Partial update — an omitted field is left unchanged; socialProfiles, if sent, replaces the whole list.'
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        location: { type: string, maxLength: 200, nullable: true }
        industry: { type: string, maxLength: 120, nullable: true }
        targetAudience: { type: string, maxLength: 300, nullable: true }
        socialProfiles:
          type: array
          items: { $ref: '#/components/schemas/SocialProfileLink' }
        logoUrl: { type: string, maxLength: 2000, nullable: true }

    Billing:
      type: object
      required: [subscriptionStatus, configured, planName]
      properties:
        subscriptionStatus: { type: string, nullable: true }
        stripeCustomerId: { type: string, nullable: true }
        configured:
          {
            type: boolean,
            description: 'True when Stripe billing env is set. Checkout is available.',
          }
        planName: { type: string }
        planPriceLabel:
          {
            type: string,
            nullable: true,
            description: 'Human-readable price from the Stripe Price, e.g. $29.00 / month.',
          }

    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }

    # ---------- Contact ----------
    ChannelEligibility:
      type: object
      properties:
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }

    Contact:
      type: object
      required: [id, businessId, name, createdAt, emailEligible, smsEligible]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        source: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }
        lastContactedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        # Derived, not stored: Lead / Customer / Past Customer — computed from Lead + Sale history.
        lifecycleStatus: { type: string, enum: [LEAD, CUSTOMER, PAST_CUSTOMER, NONE] }
        revenue: { type: number, description: Sum of non-reversed sales on this contact }
        provenance:
          type: array
          items: { $ref: '#/components/schemas/FieldProvenance' }
        records:
          type: array
          items: { $ref: '#/components/schemas/ContactSourceRecord' }

    FieldProvenance:
      type: object
      required: [field, value, source]
      properties:
        field: { type: string, enum: [name, email, phone, company] }
        value: { type: string }
        source:
          { type: string, enum: [LOOPIE, HUBSPOT, SALESFORCE, PIPEDRIVE, SHOPIFY, SQUARE, CSV] }

    ContactSourceRecord:
      type: object
      required: [id, provider, externalId, matchStatus]
      properties:
        id: { type: string }
        provider: { type: string }
        externalId: { type: string }
        matchStatus: { type: string }
        syncedAt: { type: string, format: date-time, nullable: true }
        profile:
          type: object
          additionalProperties: { type: string }
          description: Extra CRM fields from this source (job title, address, notes, unknown columns)

    CreateContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean, default: true }
        smsEligible: { type: boolean, default: true }

    ImportContactInput:
      type: object
      description: >
        One person. CSV headers and JSON keys accept the listed aliases
        (first_name, email_address, hs_object_id, …). At least one of email,
        phone, or externalId is required. Name may be omitted when firstName
        and lastName are present. Unknown columns land in profile — this
        schema deliberately allows additional properties so that a
        caller sending a raw, un-normalized row (e.g. a direct CSV-to-JSON
        dump with vendor-specific columns) doesn't get the whole import
        request rejected; ImportJobService normalizes and captures them.
      additionalProperties: true
      properties:
        name: { type: string, maxLength: 200 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        mobile: { type: string }
        company: { type: string }
        jobTitle: { type: string }
        website: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        notes: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }
        externalId: { type: string }
        profile:
          type: object
          additionalProperties: { type: string }

    UpdateContactInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }

    ImportContactsInput:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items: { $ref: '#/components/schemas/ImportContactInput' }
          maxItems: 5000

    ImportContactsResult:
      type: object
      required: [created, linked, ambiguous, skipped]
      properties:
        importJobId: { type: string }
        created: { type: integer }
        linked: { type: integer }
        ambiguous: { type: integer }
        skipped: { type: integer }

    CrmCapabilities:
      type: object
      required: [contacts, companies, deals, orders, payments, events]
      properties:
        contacts: { type: boolean }
        companies: { type: boolean }
        deals: { type: boolean }
        orders: { type: boolean }
        payments: { type: boolean }
        events: { type: boolean }

    CrmCatalogEntry:
      type: object
      required: [provider, label, capabilities]
      properties:
        provider: { type: string, enum: [HUBSPOT, SALESFORCE, SHOPIFY, SQUARE, PIPEDRIVE] }
        label: { type: string }
        capabilities: { $ref: '#/components/schemas/CrmCapabilities' }
        oauth: { type: boolean }
        configured: { type: boolean }

    Integration:
      type: object
      required: [id, businessId, provider, status, syncDirection, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        provider: { type: string, enum: [HUBSPOT, SALESFORCE, SHOPIFY, SQUARE, PIPEDRIVE] }
        label: { type: string, nullable: true }
        externalAccountId: { type: string, nullable: true }
        status: { type: string, enum: [INCOMPLETE, CONNECTED, NEEDS_REAUTH, PAUSED] }
        syncDirection: { type: string, enum: [INBOUND] }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncCreated: { type: integer, nullable: true }
        lastSyncLinked: { type: integer, nullable: true }
        lastSyncAmbiguous: { type: integer, nullable: true }
        lastSyncSkipped: { type: integer, nullable: true }
        capabilities: { $ref: '#/components/schemas/CrmCapabilities' }
        oauth: { type: boolean }
        configured: { type: boolean }
        createdAt: { type: string, format: date-time }

    SyncIntegrationResult:
      type: object
      required: [created, linked, ambiguous, skipped, orders]
      properties:
        created: { type: integer }
        linked: { type: integer }
        ambiguous: { type: integer }
        skipped: { type: integer }
        orders: { type: integer }
        lastSyncAt: { type: string, format: date-time }

    CreateIntegrationInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [HUBSPOT, SALESFORCE, SHOPIFY, SQUARE, PIPEDRIVE] }
        label: { type: string }
        externalAccountId: { type: string }

    UpdateIntegrationInput:
      type: object
      properties:
        status: { type: string, enum: [CONNECTED, PAUSED, NEEDS_REAUTH] }
        label: { type: string }

    ExternalContactRecord:
      type: object
      required: [id, businessId, provider, externalId, matchStatus, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        contactId: { type: string, nullable: true }
        integrationId: { type: string, nullable: true }
        provider: { type: string }
        externalId: { type: string }
        matchStatus: { type: string, enum: [LINKED, UNMATCHED, AMBIGUOUS] }
        candidateContactIds:
          type: array
          items: { type: string }
        syncedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ResolveContactMatchInput:
      type: object
      required: [contactId]
      properties:
        contactId: { type: string }

    IngestExternalEventInput:
      type: object
      required: [integrationId, type, externalEventId]
      properties:
        integrationId: { type: string }
        type:
          type: string
          enum:
            [
              CONTACT_CREATED,
              CONTACT_UPDATED,
              DEAL_WON,
              ORDER_CREATED,
              PAYMENT_COMPLETED,
              APPOINTMENT_COMPLETED,
              CUSTOMER_TAGGED,
            ]
        externalEventId: { type: string }
        occurredAt: { type: string, format: date-time }
        amount: { type: number }
        productOrService: { type: string }
        contact:
          type: object
          properties:
            externalId: { type: string }
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            company: { type: string }
        payload:
          type: object
          additionalProperties: true

    ExternalEvent:
      type: object
      required: [id, businessId, provider, type, externalEventId, occurredAt, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        integrationId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        saleId: { type: string, nullable: true }
        provider: { type: string }
        type: { type: string }
        externalEventId: { type: string }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    LoopieRuntimeSession:
      type: object
      required: [sessionId, token]
      properties:
        sessionId: { type: string }
        token: { type: string }
        firstAdRunId: { type: string, nullable: true }
        firstSourceType: { type: string, nullable: true }
        platformClickIds:
          type: object
          additionalProperties: { type: string, nullable: true }
        utms:
          type: object
          additionalProperties: { type: string, nullable: true }

    TrackRuntimeEventInput:
      type: object
      required: [businessId, sessionId, type]
      properties:
        businessId: { type: string }
        sessionId: { type: string }
        type: { type: string, enum: [PAGE_VIEW, FORM_START, FORM_SUBMIT] }
        pageUrl: { type: string }
        adRunId: { type: string }
        clickId: { type: string }

    # ---------- Audience ----------
    Audience:
      type: object
      required: [id, businessId, name, type, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        type: { type: string, enum: [PREDEFINED, SAVED_FILTER, MANUAL_LIST, IMPORTED_LIST] }
        filter:
          type: object
          description: >
            Free-form filter used when type = SAVED_FILTER. Keys: leadStatus, hasEmail, hasMobile, tag,
            lastPurchaseBeforeDays, hasSaleSinceDays, emailEligible, provider, adLeadNoPurchase,
            sourceCampaignId, sourceDeploymentId.
          additionalProperties: true
          nullable: true
        memberCount: { type: integer }
        eligibleCount:
          type: integer
          description: Count respecting channel opt-out for the audience's intended channel.
        createdAt: { type: string, format: date-time }

    CreateAudienceInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [SAVED_FILTER, MANUAL_LIST, IMPORTED_LIST] }
        filter:
          type: object
          additionalProperties: true
        contactIds:
          type: array
          items: { type: string }
          description: Used when type = MANUAL_LIST or IMPORTED_LIST.

    UpdateAudienceInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filter:
          type: object
          additionalProperties: true

    # ---------- Asset ----------
    Placement:
      type: string
      enum: [SQUARE, PORTRAIT, STORY, LANDSCAPE]
      description: Ad placement this asset's aspect ratio fits (Feed 1:1 / 4:5, Story 9:16, Landscape 16:9).

    Asset:
      type: object
      required:
        - id
        - businessId
        - type
        - name
        - createdAt
        - placements
        - usedInAds
        - usedInTemplates
      properties:
        id: { type: string }
        businessId: { type: string }
        type: { type: string, enum: [IMAGE, TEXT, VIDEO, AUDIO] }
        name: { type: string }
        url: { type: string, nullable: true }
        textContent: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        widthPx: { type: integer, nullable: true }
        heightPx: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        aspectRatio: { type: string, nullable: true }
        placements:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        usedInAds: { type: integer }
        usedInTemplates: { type: integer }
        createdAt: { type: string, format: date-time }

    AssetFileInput:
      type: object
      required: [filename, mimeType, data]
      properties:
        filename: { type: string, minLength: 1, maxLength: 200 }
        mimeType: { type: string, minLength: 1, maxLength: 100 }
        data: { type: string, description: 'Base64 file body, optionally a data URL.' }

    CreateAssetInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [IMAGE, TEXT, VIDEO, AUDIO] }
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string }
        textContent: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }
        durationMs: { type: integer, minimum: 0 }
        file: { $ref: '#/components/schemas/AssetFileInput' }

    UpdateAssetInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string }
        textContent: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }
        durationMs: { type: integer, minimum: 0 }
        file: { $ref: '#/components/schemas/AssetFileInput' }

    # ---------- Template ----------
    Template:
      type: object
      required: [id, businessId, name, channel, body, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        purpose: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        body: { type: string }
        mediaAssetId: { type: string, nullable: true }
        cta: { type: string, nullable: true }
        personalizationTokens:
          type: array
          items: { type: string }
        suggestedAudienceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateTemplateInput:
      type: object
      required: [name, channel, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        purpose: { type: string }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        mediaAssetId: { type: string }
        cta: { type: string }
        personalizationTokens:
          type: array
          items: { type: string }
        suggestedAudienceId: { type: string }

    UpdateTemplateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        subject: { type: string, nullable: true }
        body: { type: string, minLength: 1 }
        cta: { type: string, nullable: true }

    # ---------- Creative ----------
    CreativeCampaign:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Creative:
      type: object
      required:
        [
          id,
          businessId,
          name,
          version,
          assetIds,
          createdAt,
          impressions,
          clicks,
          conversions,
          spend,
          campaignCount,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        hostedUrl: { type: string, nullable: true }
        version: { type: integer }
        previousVersionId: { type: string, nullable: true }
        assetIds:
          type: array
          items: { type: string }
        previewUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        spend: { type: number }
        campaignCount: { type: integer }
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CreativeCampaign' }

    CreateCreativeInput:
      type: object
      required: [name, assetIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        assetIds:
          type: array
          items: { type: string }
          minItems: 1

    UpdateCreativeInput:
      type: object
      required: [assetIds]
      description: >
        Any change creates a new immutable Creative version (docs/02-campaign-model-spec.md)
        rather than overwriting history; the response is the new version, chained via previousVersionId.
      properties:
        name: { type: string }
        assetIds:
          type: array
          items: { type: string }
          minItems: 1

    # ---------- Message ----------
    Message:
      type: object
      required: [id, businessId, channel, body, audienceId, status, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        subject: { type: string, nullable: true }
        body: { type: string }
        audienceId: { type: string }
        templateId: { type: string, nullable: true }
        automationId: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, SCHEDULED, SENT, FAILED] }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        recipientCount: { type: integer }
        createdAt: { type: string, format: date-time }

    CreateMessageInput:
      type: object
      required: [channel, body, audienceId]
      properties:
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        audienceId: { type: string }
        templateId: { type: string }
        automationId: { type: string }
        scheduledAt: { type: string, format: date-time }

    UpdateMessageInput:
      type: object
      properties:
        subject: { type: string, nullable: true }
        body: { type: string, minLength: 1 }
        audienceId: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }

    TestSendInput:
      type: object
      required: [toEmailOrPhone]
      properties:
        toEmailOrPhone: { type: string }

    MessagePerformance:
      type: object
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        replied: { type: integer }
        unsubscribed: { type: integer }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }

    # ---------- Automation ----------
    Automation:
      type: object
      required: [id, businessId, name, trigger, action, isActive, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        trigger:
          type: string
          enum:
            [
              MESSAGE_SENT,
              CONTACT_REPLIES,
              LEAD_CREATED,
              LEAD_STATUS_CHANGED,
              SALE_RECORDED,
              DATE_REACHED,
            ]
          description: >
            LEAD_CREATED fires regardless of source_type (message reply or campaign deployment) —
            see docs/00-unified-data-model.md "Resolved: Campaign and Message Stay Distinct Domain Concepts".
        waitDays: { type: integer, nullable: true }
        condition:
          type: string
          nullable: true
          enum:
            [
              HAS_REPLIED,
              HAS_NOT_REPLIED,
              LEAD_STILL_OPEN,
              LEAD_REACHED_STAGE,
              CUSTOMER_STATUS,
              CHANNEL_ELIGIBILITY,
              null,
            ]
        conditionValue:
          type: object
          additionalProperties: true
          nullable: true
        action:
          type: string
          enum:
            [SEND_EMAIL, SEND_TEXT, CREATE_REMINDER, CHANGE_LEAD_STATUS, NOTIFY_USER, STOP_SEQUENCE]
        actionTemplateId: { type: string, nullable: true }
        actionValue:
          type: object
          additionalProperties: true
          nullable: true
        isActive: { type: boolean }
        pausedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAutomationInput:
      type: object
      required: [name, trigger, action]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        trigger:
          type: string
          enum:
            [
              MESSAGE_SENT,
              CONTACT_REPLIES,
              LEAD_CREATED,
              LEAD_STATUS_CHANGED,
              SALE_RECORDED,
              DATE_REACHED,
            ]
        waitDays: { type: integer, minimum: 0, maximum: 30 }
        condition:
          type: string
          enum:
            [
              HAS_REPLIED,
              HAS_NOT_REPLIED,
              LEAD_STILL_OPEN,
              LEAD_REACHED_STAGE,
              CUSTOMER_STATUS,
              CHANNEL_ELIGIBILITY,
              null,
            ]
        conditionValue:
          type: object
          additionalProperties: true
        action:
          type: string
          enum:
            [SEND_EMAIL, SEND_TEXT, CREATE_REMINDER, CHANGE_LEAD_STATUS, NOTIFY_USER, STOP_SEQUENCE]
        actionTemplateId: { type: string }
        actionValue:
          type: object
          additionalProperties: true

    UpdateAutomationInput:
      type: object
      properties:
        name: { type: string }
        waitDays: { type: integer, minimum: 0, maximum: 30 }
        actionTemplateId: { type: string, nullable: true }

    AutomationLog:
      type: object
      required: [id, automationId, contactId, action, outcome, triggeredAt]
      properties:
        id: { type: string }
        automationId: { type: string }
        contactId: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [SENT, SKIPPED, FAILED] }
        reasonSkipped: { type: string, nullable: true }
        triggeredAt: { type: string, format: date-time }

    # ---------- Affiliates ----------
    # Assignment (class/deal/manager/overrides) chooses which policy applies. AffiliateDeal is the
    # commission policy (PERCENTAGE|FIXED, eligibility from referral click, payout cadence).
    # Sale freezes resolved economics onto SaleAffiliateSplit; FinanceService posts commissions.
    AffiliateClass:
      type: object
      required: [id, businessId, name, maxAffiliateRateBps, maxManagerShareBps, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        maxAffiliateRateBps: { type: integer }
        maxManagerShareBps: { type: integer }
        defaultDealId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAffiliateClassInput:
      type: object
      required: [name, maxAffiliateRateBps, maxManagerShareBps]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        maxAffiliateRateBps: { type: integer, minimum: 0, maximum: 10000 }
        maxManagerShareBps: { type: integer, minimum: 0, maximum: 10000 }

    UpdateAffiliateClassInput:
      type: object
      properties:
        name: { type: string }
        maxAffiliateRateBps: { type: integer, minimum: 0, maximum: 10000 }
        maxManagerShareBps: { type: integer, minimum: 0, maximum: 10000 }
        defaultDealId: { type: string, nullable: true }

    AffiliateDeal:
      type: object
      required:
        [
          id,
          businessId,
          name,
          commissionRuleType,
          managerShareBps,
          payoutCadence,
          isActive,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        classId: { type: string, nullable: true }
        name: { type: string }
        commissionRuleType: { type: string, enum: [PERCENTAGE, FIXED] }
        affiliateRateBps: { type: integer, nullable: true }
        fixedAmountMinor: { type: integer, nullable: true }
        managerShareBps:
          {
            type: integer,
            description: Percent of gross commission paid to the manager. Does not increase total cost.,
          }
        eligibilityWindowDays:
          type: integer
          nullable: true
          description: Cookie-window bound measured from the referral click, not Lead creation. null = unlimited.
        payoutThresholdMinor: { type: integer, nullable: true }
        payoutCadence: { type: string, enum: [MANUAL, WEEKLY, MONTHLY] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateAffiliateDealInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        classId: { type: string }
        commissionRuleType:
          { type: string, enum: [PERCENTAGE, FIXED], description: Defaults to PERCENTAGE. }
        affiliateRateBps: { type: integer, minimum: 1, maximum: 10000 }
        fixedAmountMinor: { type: integer, minimum: 1 }
        managerShareBps: { type: integer, minimum: 0, maximum: 10000 }
        eligibilityWindowDays: { type: integer, minimum: 1 }
        payoutThresholdMinor: { type: integer, minimum: 1 }
        payoutCadence: { type: string, enum: [MANUAL, WEEKLY, MONTHLY] }

    UpdateAffiliateDealInput:
      type: object
      properties:
        name: { type: string }
        classId: { type: string, nullable: true }
        commissionRuleType: { type: string, enum: [PERCENTAGE, FIXED] }
        affiliateRateBps: { type: integer, minimum: 1, maximum: 10000 }
        fixedAmountMinor: { type: integer, minimum: 1 }
        managerShareBps: { type: integer, minimum: 0, maximum: 10000 }
        eligibilityWindowDays: { type: integer, minimum: 1, nullable: true }
        payoutThresholdMinor: { type: integer, minimum: 1, nullable: true }
        payoutCadence: { type: string, enum: [MANUAL, WEEKLY, MONTHLY] }
        isActive: { type: boolean }

    Affiliate:
      type: object
      required:
        [
          id,
          businessId,
          name,
          referralCode,
          referralUrl,
          classId,
          commissionRuleType,
          payoutCadence,
          pendingMinor,
          payableMinor,
          paidMinor,
          isActive,
          createdAt,
          payoutsEnabled,
          connectStatus,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        referralCode: { type: string, description: 'Globally unique, like LandingPage.slug.' }
        referralUrl:
          {
            type: string,
            description: 'GET this URL to track a click and redirect the visitor — GET /r/affiliate/{affiliateId}.',
          }
        classId: { type: string }
        dealId: { type: string, nullable: true }
        managerId: { type: string, nullable: true }
        userId: { type: string, nullable: true }
        affiliateRateOverrideBps: { type: integer, nullable: true }
        managerShareOverrideBps: { type: integer, nullable: true }
        commissionRuleType:
          type: string
          enum: [PERCENTAGE, FIXED]
          description: Resolved live from assigned Deal (display only — historical earnings use frozen commissions).
        commissionRateBps: { type: integer, nullable: true }
        commissionFixedAmountMinor: { type: integer, nullable: true }
        managerShareBps: { type: integer }
        affiliateNetBps: { type: integer, nullable: true }
        eligibilityWindowDays: { type: integer, nullable: true }
        payoutThresholdMinor: { type: integer, nullable: true }
        payoutCadence: { type: string, enum: [MANUAL, WEEKLY, MONTHLY] }
        lastPayoutAt: { type: string, format: date-time, nullable: true }
        downlineCount: { type: integer }
        className: { type: string, nullable: true }
        managerName: { type: string, nullable: true }
        destinationPageName: { type: string, nullable: true }
        destinationHostedUrl:
          {
            type: string,
            nullable: true,
            description: 'Live hosted URL of the assigned landing page. Changing destination does not rewrite past clicks.',
          }
        pendingMinor:
          {
            type: integer,
            description: Sum of frozen PENDING commissions for this payee. Not a balance.,
          }
        payableMinor:
          {
            type: integer,
            description: Sum of frozen PAYABLE commissions for this payee. Not a balance.,
          }
        paidMinor:
          {
            type: integer,
            description: Sum of frozen PAID commissions for this payee. Not a balance.,
          }
        initialPassword: { type: string, description: Returned once when createLogin is true. }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl:
          {
            type: string,
            nullable: true,
            description: Fallback redirect if no landing page is set.,
          }
        isActive: { type: boolean }
        pausedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        payoutsEnabled:
          {
            type: boolean,
            description: 'Stripe Connect payouts_enabled. LOOPIE stores capability, not bank or KYC fields.',
          }
        connectStatus:
          type: string
          enum: [NOT_CONNECTED, ONBOARDING, READY, RESTRICTED]
          description: 'Derived from Connect capabilities. NOT_CONNECTED / ONBOARDING / READY / RESTRICTED.'
        openPayoutStatus:
          type: string
          nullable: true
          enum: [PENDING, TRANSFERRED]
          description: 'In-flight Connect payout. PENDING = Sending; TRANSFERRED = on the connected account, not yet bank-received.'

    CreateAffiliateInput:
      type: object
      required: [name, classId]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email }
        referralCode:
          {
            type: string,
            minLength: 1,
            maxLength: 40,
            pattern: '^[a-zA-Z0-9-]+$',
            description: Auto-generated if omitted.,
          }
        classId: { type: string }
        dealId: { type: string }
        managerId: { type: string }
        createLogin: { type: boolean }
        destinationLandingPageId: { type: string }
        destinationUrl: { type: string }

    UpdateAffiliateInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        classId: { type: string }
        dealId: { type: string, nullable: true }
        managerId: { type: string, nullable: true }
        affiliateRateOverrideBps: { type: integer, minimum: 0, maximum: 10000, nullable: true }
        managerShareOverrideBps: { type: integer, minimum: 0, maximum: 10000, nullable: true }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl: { type: string, nullable: true }

    AffiliateEarnings:
      type: object
      required: [pendingMinor, payableMinor, paidMinor, commissions, payouts]
      properties:
        pendingMinor: { type: integer }
        payableMinor: { type: integer }
        paidMinor: { type: integer }
        commissions:
          type: array
          items:
            type: object
            required: [id, amountMinor, currency, status, createdAt]
            properties:
              id: { type: string }
              amountMinor: { type: integer }
              currency: { type: string }
              status: { type: string, enum: [PENDING, PAYABLE, PAID, CANCELLED, REVERSED] }
              sourceRef: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
        payouts:
          type: array
          items:
            type: object
            required: [id, amountMinor, currency, status, createdAt]
            properties:
              id: { type: string }
              amountMinor: { type: integer }
              currency: { type: string }
              status:
                {
                  type: string,
                  enum: [PENDING, TRANSFERRED, PAID, FAILED, REVERSED],
                  description: 'PENDING = Sending. TRANSFERRED is not bank-received.',
                }
              commissionIds:
                type: array
                items: { type: string }
              createdAt: { type: string, format: date-time }

    # ---------- Campaign / Deployment ----------
    Campaign:
      type: object
      required: [id, businessId, name, budget, startDate, status, platforms, creativeIds, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        budget: { type: number }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        destinationUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        platforms:
          type: array
          items: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        creativeIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    CreateCampaignInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        budget: { type: number, minimum: 0 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        destinationUrl: { type: string }
        platforms:
          type: array
          items: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
          description: >
            LOOPIE creates first-party AdUnit rows (served by apps/ad-server), not
            Deployment rows. META/GOOGLE/TIKTOK create Deployment rows. Omit or pass
            an empty list to create a named draft with no inventory yet.
        creativeIds:
          type: array
          items: { type: string }

    UpdateCampaignInput:
      type: object
      properties:
        name: { type: string }
        budget: { type: number, minimum: 0 }
        endDate: { type: string, format: date-time, nullable: true }
        destinationUrl: { type: string }
        creativeIds:
          type: array
          items: { type: string }
        platforms:
          type: array
          items: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
          minItems: 1
          description: >
            Changing this (or creativeIds) reconciles live Deployment/AdUnit inventory:
            newly-desired platform x creative combos are created (or revived if previously
            retired), and combos no longer desired are retired (status: ENDED), never deleted —
            see lib/campaignInventory.ts. Use POST /campaigns/{id}/end to stop everything instead
            of clearing this to an empty list.

    Deployment:
      type: object
      required:
        [
          id,
          campaignId,
          creativeId,
          platform,
          status,
          spend,
          impressions,
          clicks,
          conversions,
          createdAt,
        ]
      properties:
        id: { type: string }
        campaignId: { type: string }
        creativeId: { type: string }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK] }
        externalCampaignId: { type: string, nullable: true }
        externalAdSetId: { type: string, nullable: true }
        externalAdId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED] }
        spend: { type: number }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        destinationLandingPageId:
          type: string
          nullable: true
          description: When set, GET /r/{deploymentId} redirects here instead of the campaign's destinationUrl.
        trackedUrl:
          type: string
          description: Redirect URL for this deployment — GET /r/{deploymentId}.
        createdAt: { type: string, format: date-time }

    CreateDeploymentInput:
      type: object
      required: [creativeId, platform]
      properties:
        creativeId: { type: string }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK] }
        externalCampaignId: { type: string }
        externalAdSetId: { type: string }
        externalAdId: { type: string }
        destinationLandingPageId: { type: string }

    UpdateDeploymentInput:
      description: V1 has no live platform sync — spend/status/metrics are entered manually (Parking lot — see MVP Definition).
      type: object
      properties:
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED] }
        spend: { type: number, minimum: 0 }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        conversions: { type: integer, minimum: 0 }
        destinationLandingPageId: { type: string, nullable: true }

    # ---------- Media/Advertisement/AdRun (2026-08-27) — see CLAUDE.md's migration audit ----------
    Advertisement:
      type: object
      required: [id, businessId, name, assetIds, createdAt, updatedAt]
      description: >
        The "Media" grouping entity in Media -> Advertisement -> AdRun — content comes directly
        from Asset via AdvertisementAsset, not the older per-campaign Creative model. Media is
        selected once here; every AdRun under it reuses the same attached assets when it
        provisions on a platform.
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        assetIds:
          type: array
          items: { type: string }
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [DRAFT, READY, RUNNING, PAUSED, FAILED]
          description: >
            Derived from current AdRuns. DRAFT = none, READY = created but not live,
            RUNNING = at least one active buy, PAUSED = buys exist but none active,
            FAILED = a buy failed.
        spend: { type: number }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        dailyBudget:
          type: number
          description: Sum of daily budgets on ACTIVE buys.
        destinations:
          type: array
          items: { type: string }
          description: 'Labels for current non-ended buys, e.g. Meta Feed.'

    CreateAdvertisementInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        assetIds:
          type: array
          items: { type: string }

    UpdateAdvertisementInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        assetIds:
          type: array
          items: { type: string }
          description: Wholesale replace, same convention as Campaign.creativeIds — omit to leave media unchanged.

    AdRun:
      type: object
      required:
        [
          id,
          advertisementId,
          platform,
          status,
          budget,
          spend,
          impressions,
          clicks,
          conversions,
          leads,
          sales,
          revenue,
          syncHealth,
          trackedUrl,
          createdAt,
        ]
      properties:
        id: { type: string }
        advertisementId: { type: string }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        placement: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED, VALIDATION_FAILED, PROVISIONING_FAILED] }
        budget: { type: number, nullable: true }
        spend: { type: number }
        impressions: { type: integer }
        reach:
          type: integer
          nullable: true
          description: Unique-person reach, provider-reported — distinct from raw impressions. Null until first synced.
        clicks: { type: integer }
        conversions: { type: integer }
        providerState:
          type: string
          nullable: true
          enum: [NOT_SENT, DRAFT_SENT, UNDER_REVIEW, ELIGIBLE, LIVE, PAUSED, LIMITED, REJECTED, ENDED, UNKNOWN]
          description: The platform's own delivery state, normalized — independent of `status` (LOOPIE's order state). Null until first synced.
        providerStateRaw:
          type: string
          nullable: true
          description: The connector's own unmapped status string (e.g. Meta's effective_status), for audit/debugging.
        syncHealth:
          type: string
          enum: [CURRENT, DELAYED, FAILED, DISCONNECTED, NEVER_SYNCED]
          description: CURRENT downgrades to DELAYED at read time once lastSyncedAt exceeds the freshness SLA.
        syncError:
          type: string
          nullable: true
          description: The most recent sync failure's message. Cleared on the next successful sync.
        effectiveBudget:
          type: number
          nullable: true
          description: Provider-reported daily budget, for comparison against `budget` (LOOPIE's requested value). Null until synced or when the platform doesn't report one.
        effectiveStartDate:
          type: string
          format: date-time
          nullable: true
          description: Provider-reported schedule start, for comparison against `startDate`. Null until synced.
        effectiveEndDate:
          type: string
          format: date-time
          nullable: true
          description: Provider-reported schedule end, for comparison against `endDate`. Null until synced, or when the platform reports no end date.
        country:
          type: string
          nullable: true
          description: Requested targeting country. Defaults from the platform connection's own default at send time.
        locationNote:
          type: string
          nullable: true
          description: Requested targeting location (free text), resolved into a real radius-targeted spot by connectors that support it. Null means country-only targeting.
        radiusMiles:
          type: integer
          nullable: true
          description: Requested radius in miles around locationNote. Null when locationNote is null.
        effectiveCountry:
          type: string
          nullable: true
          description: Provider-reported targeting country, for comparison against `country`. Null until synced.
        effectiveLocationNote:
          type: string
          nullable: true
          description: Provider-reported targeting location, best-effort — not guaranteed to echo `locationNote`'s exact text. Null until synced, or when the platform reports country-only targeting.
        effectiveRadiusMiles:
          type: integer
          nullable: true
          description: Provider-reported radius in miles, for comparison against `radiusMiles`. Null until synced, or when the platform reports country-only targeting.
        providerIssues:
          type: array
          items: { type: string }
          nullable: true
          description: Review/rejection reasons from the platform's own last sync (e.g. Meta's issues_info messages). Null until synced, or when the platform reports none.
        supersedesRunId:
          type: string
          nullable: true
          description: The prior AdRun (same Advertisement) this one replaced, when created via relaunch/replace-creative/replace-destination rather than a first send.
        leads:
          type: integer
          description: Leads whose sourceAdRunId is this run, live-computed (not denormalized).
        sales:
          type: integer
          description: Active (non-reversed) sales attributed to this run's leads.
        revenue:
          type: number
          description: Sum of active sale amounts attributed to this run's leads.
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        externalCampaignId: { type: string, nullable: true }
        externalAdSetId: { type: string, nullable: true }
        externalAdId: { type: string, nullable: true }
        previewUrl:
          type: string
          nullable: true
        managerUrl:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
          description: Populates only once the external platform object genuinely exists — never speculative.
        destinationLandingPageId: { type: string, nullable: true }
        orderSnapshot:
          type: object
          nullable: true
          additionalProperties: true
          description: Frozen media-order fields at send time. Superseded by mediaOrderRevision for runs sent after that column existed; kept for older rows and as the existing read path.
        mediaOrderRevisionId: { type: string, nullable: true }
        mediaOrderRevision:
          type: object
          allOf: [{ $ref: '#/components/schemas/MediaOrderRevision' }]
          nullable: true
          description: The durable, immutable, numbered authorization record this run was actually sent against. Null for rows sent before this existed.
        trackedUrl:
          type: string
          description: Redirect URL for this ad run — GET /r/adrun/{adRunId}.
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: When this run's data (or its provisioning) was last written from a connector.
        createdAt: { type: string, format: date-time }

    InboxThreadSummary:
      type: object
      description: A thread's list-view/detail-header shape — same object for both listInboxThreads and getInboxThread.
      required: [id, type, subject, unread, lastMessageAt, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [CONTACT, ADVERTISEMENT, PAGE, INTEGRATION, SYSTEM] }
        subject: { type: string }
        contactId: { type: string, nullable: true }
        advertisementId: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        landingPageId: { type: string, nullable: true, description: Only set when type is PAGE. }
        integrationPlatform: { type: string, nullable: true, description: Only set when type is INTEGRATION. }
        previewKind:
          type: string
          enum: [SYSTEM, EMAIL, SMS]
          nullable: true
          description: The most recent message's kind, for a list-row preview icon/label.
        previewBody: { type: string, nullable: true }
        unread:
          type: boolean
          description: True when the thread's most recent message postdates its read watermark.
        lastMessageAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    InboxMessage:
      type: object
      description: >
        One message in a thread. For an ADVERTISEMENT thread, a real persisted row. For a CONTACT
        thread, read live from Interaction joined back to Message and given a stable id (the
        Interaction's own id) — never a second persisted copy of the same content.
      required: [id, kind, direction, body, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [SYSTEM, EMAIL, SMS] }
        direction: { type: string, enum: [INBOUND, OUTBOUND, INTERNAL] }
        subject: { type: string, nullable: true }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    MediaOrderRevision:
      type: object
      description: >
        A durable, immutable, numbered record of exactly what was authorized for one
        (Advertisement, platform, placement) destination — replaces AdRun.orderSnapshot's loose
        untyped JSON for runs sent after this existed. Numbered per (advertisementId, platform,
        placement): a relaunch to the same destination continues that sequence.
      required:
        [
          id,
          revision,
          goal,
          successEvent,
          country,
          dailyBudgetMinor,
          currency,
          startAt,
          assetIds,
          contentHash,
          createdAt,
        ]
      properties:
        id: { type: string }
        revision: { type: integer }
        goal: { type: string }
        successEvent: { type: string }
        country: { type: string }
        locationNote: { type: string, nullable: true }
        radiusMiles:
          type: integer
          nullable: true
          description: Radius in miles around locationNote. Null when locationNote is null (country-only targeting).
        dailyBudgetMinor: { type: integer }
        currency: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        destinationLandingPageId: { type: string, nullable: true }
        destinationLandingPageVersionId: { type: string, nullable: true }
        assetIds:
          type: array
          items: { type: string }
          description: Frozen from the Advertisement's attached media at the exact moment of this revision.
        accountName: { type: string, nullable: true }
        accountCurrency: { type: string, nullable: true }
        accountTimezone: { type: string, nullable: true }
        adAccountId: { type: string, nullable: true }
        contentHash:
          type: string
          description: Deterministic hash of the authorized fields — lets two revisions be compared for "did anything actually change."
        createdAt: { type: string, format: date-time }

    CreateAdRunInput:
      type: object
      required: [platform, idempotencyKey]
      description: >
        The declarative "create and provision" command: state intent, LOOPIE owns validate ->
        create AdRun -> call the platform connector (if one is registered, configured, and
        connected for this business) -> persist external ids -> mark PENDING ("ready" — pushed as
        a paused draft awaiting manual activation, same convention as Deployment) or
        VALIDATION_FAILED. If no connector applies, the AdRun is created PENDING for manual entry,
        exactly like a non-Meta Deployment today.
      properties:
        platform: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        placement: { type: string, nullable: true }
        budget: { type: number, minimum: 0 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        destinationLandingPageId: { type: string }
        orderSnapshot:
          type: object
          additionalProperties: true
          description: Frozen media-order fields at send time.
        supersedesRunId:
          type: string
          description: >
            A prior AdRun on the same Advertisement this new one replaces (a "new version" relaunch,
            not a first send). That run is marked ENDED once this one is created — never left live
            alongside it. Omit for a first send to a destination.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Client-generated once per creation attempt and resent unchanged on any retry — a
            retried request returns the same AdRun and never triggers a second connector push.

    UpdateAdRunInput:
      description: Manual metrics/status entry, same "no live platform sync in V1" model as Deployment. Cannot change platform or advertisementId — an AdRun's source identity is immutable once created.
      type: object
      properties:
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED, VALIDATION_FAILED, PROVISIONING_FAILED] }
        spend: { type: number, minimum: 0 }
        budget: { type: number, minimum: 0 }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        conversions: { type: integer, minimum: 0 }
        destinationLandingPageId: { type: string, nullable: true }

    PlatformPlacementCapability:
      type: object
      required: [supportedMediaTypes, requiresDestinationUrl]
      properties:
        supportedMediaTypes:
          type: array
          items: { type: string, enum: [IMAGE, VIDEO, TEXT] }
        recommendedAspectRatios:
          type: array
          items: { type: string }
          nullable: true
        maxTextLength:
          type: integer
          nullable: true
        requiresDestinationUrl:
          type: boolean

    PlatformCapabilities:
      type: object
      required: [oauth, mappingFields, pushDraft, pullSpend, pullStatus, activate, pause, end]
      properties:
        oauth: { type: boolean }
        mappingFields:
          type: array
          items: { type: string, enum: [adAccount, page, defaultCountry] }
        pushDraft: { type: boolean }
        pullSpend: { type: boolean }
        pullStatus:
          type: boolean
          description: Can fetch the pushed object's real delivery state and performance metrics back from the platform.
        activate:
          type: boolean
          description: Can remotely activate spend — a Resume actually turns delivery on at the platform, not just locally.
        pause:
          type: boolean
          description: Can remotely pause an already-active run.
        end:
          type: boolean
          description: Can remotely end (archive) a run — one-way.
        editBudget: { type: boolean }
        editSchedule: { type: boolean }
        editAudience: { type: boolean }
        editModes:
          type: object
          description: >
            Per-field edit-mode classification (NONE/IN_PLACE/RECREATE — see EditMode's doc comment
            in apps/server/src/lib/platforms/types.ts). Additive to editBudget/editSchedule above,
            which stay the load-bearing flags gating whether a live editor actually exists; this is
            the richer contract the UI reads to explain what changing a field costs the business
            before they commit to it, including for fields with no editor built yet.
          properties:
            budget: { $ref: '#/components/schemas/EditMode' }
            schedule: { $ref: '#/components/schemas/EditMode' }
            creative: { $ref: '#/components/schemas/EditMode' }
            destination: { $ref: '#/components/schemas/EditMode' }
            targeting: { $ref: '#/components/schemas/EditMode' }

    EditMode:
      type: string
      enum: [NONE, IN_PLACE, RECREATE]
      description: >
        NONE = can't be changed from LOOPIE yet. IN_PLACE = a PATCH-style request against the
        existing ad/ad-set/campaign object. RECREATE = requires a new provider execution (the
        "Create new version" relaunch flow), never an in-place patch of the current run.

    PlatformConnection:
      type: object
      required: [platform, status, capabilities, configured]
      properties:
        platform: { type: string, enum: [META, GOOGLE, TIKTOK] }
        status: { type: string, enum: [DISCONNECTED, INCOMPLETE, CONNECTED, NEEDS_REAUTH] }
        adAccountId: { type: string, nullable: true }
        accountName:
          type: string
          nullable: true
          description: The ad account's own display name, fetched from the platform when adAccountId was set.
        currency:
          type: string
          nullable: true
          description: The ad account's billing currency, as reported by the platform.
        timezone:
          type: string
          nullable: true
          description: The ad account's own timezone, as reported by the platform — not a LOOPIE business timezone.
        pageId: { type: string, nullable: true }
        defaultCountry: { type: string }
        capabilities: { $ref: '#/components/schemas/PlatformCapabilities' }
        configured: { type: boolean }

    UpdatePlatformConnectionInput:
      type: object
      properties:
        adAccountId: { type: string }
        pageId: { type: string }
        defaultCountry: { type: string, minLength: 2, maxLength: 2 }

    PlatformAccount:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, nullable: true }
        timezone: { type: string, nullable: true }

    OAuthStart:
      type: object
      required: [url]
      properties:
        url: { type: string }

    CampaignPerformance:
      type: object
      properties:
        spend: { type: number }
        views: { type: integer }
        clicks: { type: integer }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }
        cpl: { type: number, nullable: true }
        byCreative:
          type: array
          items:
            type: object
            properties:
              creativeId: { type: string }
              creativeName: { type: string }
              views: { type: integer }
              clicks: { type: integer }
              leads: { type: integer }
              sales: { type: integer }
        byPlatform:
          type: array
          description: Includes a LOOPIE row whenever the campaign has AdUnits with recorded activity, alongside external platforms.
          items:
            type: object
            properties:
              platform: { type: string }
              spend: { type: number }
              leads: { type: integer }
              sales: { type: integer }
        byLandingPage:
          type: array
          description: Landing Page → Creative → Campaign → Platform rollup, scoped to this campaign's pages.
          items:
            type: object
            properties:
              landingPageId: { type: string }
              landingPageName: { type: string }
              views: { type: integer }
              uniqueSessions: { type: integer }
              submissions: { type: integer }
              conversionRate: { type: number, nullable: true }
              leads: { type: integer }
              sales: { type: integer }

    # ---------- Landing Pages ----------
    LandingPageTemplate:
      type: object
      required: [id, isSystem, name, formatVersion, schema, createdAt]
      properties:
        id: { type: string }
        businessId:
          {
            type: string,
            nullable: true,
            description: 'null = system template, shippable by a future external catalog.',
          }
        isSystem: { type: boolean }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        formatVersion: { type: string }
        previewImageUrl: { type: string, nullable: true }
        schema:
          type: object
          additionalProperties: true
          description: >
            { sections: [{ key, type, order, hideable, editable: string[] }], themeTokens: string[] } —
            a structured manifest of what an author may edit, not markup. Versioned by formatVersion,
            independent of LOOPIE's own release, so an external template catalog can supply one LOOPIE imports.
        createdAt: { type: string, format: date-time }

    LandingPage:
      type: object
      required:
        [
          id,
          businessId,
          templateId,
          name,
          slug,
          status,
          content,
          formStartCount,
          submissionCount,
          createdAt,
          previewUrl,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        templateId: { type: string }
        formId: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        customDomain: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        content:
          type: object
          additionalProperties: true
          description: Draft working copy, shaped per the template's schema.
        theme: { type: object, nullable: true, additionalProperties: true }
        publishedVersionId: { type: string, nullable: true }
        hostedUrl:
          {
            type: string,
            description: 'Public live URL — GET /p/{slug}. 404 until the page is published.',
          }
        previewUrl:
          {
            type: string,
            description: 'Authenticated draft preview — GET /landing-pages/{id}/preview.',
          }
        formStartCount: { type: integer, description: 'Approximate — not deduplicated by session.' }
        submissionCount:
          {
            type: integer,
            description: 'Completed submissions (FormSubmission rows) — the real outcome, distinct from formStartCount which also counts abandoned attempts.',
          }
        adSlotCount: { type: integer }
        slots:
          type: array
          items: { $ref: '#/components/schemas/LandingPageAdSlot' }
        createdAt: { type: string, format: date-time }

    LandingPageAdSlot:
      type: object
      required: [id, sortOrder, placement]
      properties:
        id: { type: string }
        sortOrder: { type: integer }
        placement: { type: string, enum: [AFTER_HERO, BEFORE_FORM, AFTER_FORM, BOTTOM] }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/LandingPageAdSlotAssignment' }

    LandingPageAdSlotAssignment:
      type: object
      required: [id, slotId, adRunId, status, weight]
      properties:
        id: { type: string }
        slotId: { type: string }
        adRunId: { type: string }
        status:
          {
            type: string,
            enum: [PENDING, READY, ACTIVE, PAUSED, ENDED, VALIDATION_FAILED, PROVISIONING_FAILED],
          }
        weight: { type: integer }

    ReplaceLandingPageAdSlotsInput:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          maxItems: 24
          items:
            type: object
            required: [placement]
            properties:
              placement: { type: string, enum: [AFTER_HERO, BEFORE_FORM, AFTER_FORM, BOTTOM] }
              adRunIds:
                type: array
                items: { type: string }

    CreateLandingPageInput:
      type: object
      required: [templateId, name, slug]
      properties:
        templateId: { type: string }
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        formId: { type: string }
        content: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }

    UpdateLandingPageInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        customDomain: { type: string, nullable: true }
        formId: { type: string, nullable: true }
        templateId: { type: string }
        content: { type: object, additionalProperties: true }
        theme: { type: object, nullable: true, additionalProperties: true }

    PublishedPageVersion:
      type: object
      required: [id, landingPageId, version, content, publishedAt]
      properties:
        id: { type: string }
        landingPageId: { type: string }
        version: { type: integer }
        content: { type: object, additionalProperties: true }
        theme: { type: object, nullable: true, additionalProperties: true }
        formId: { type: string, nullable: true }
        formSnapshot:
          type: object
          nullable: true
          description: >
            The form's submitLabel/successMessage/fields exactly as they were at the moment this
            version was published — frozen so that editing the live Form's fields afterward
            cannot change what an already-published page renders or validates submissions
            against. Null for versions published before this snapshot existed, and for pages
            with no form attached.
          required: [id, submitLabel, successMessage, fields]
          properties:
            id: { type: string }
            submitLabel: { type: string }
            successMessage: { type: string, nullable: true }
            fields:
              type: array
              items: { $ref: '#/components/schemas/FormFieldSchema' }
        publishedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }

    LandingPageExport:
      type: object
      required: [filename, html]
      properties:
        filename: { type: string }
        html: { type: string, description: 'Self-contained, downloadable HTML page.' }

    LandingPagePerformance:
      type: object
      properties:
        views: { type: integer }
        uniqueSessions: { type: integer }
        formStarts: { type: integer }
        submissions: { type: integer }
        conversionRate:
          { type: number, nullable: true, description: 'submissions / uniqueSessions' }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }

    SubmitLandingPageFormInput:
      type: object
      required: [data, sessionId]
      properties:
        sessionId:
          type: string
          description: HMAC-signed visitor session token issued on click or hosted page serve.
        data:
          type: object
          additionalProperties: true
          description: Field values keyed by FormField.fieldKey.
        utmSource: { type: string }
        utmMedium: { type: string }
        utmCampaign: { type: string }
        utmContent: { type: string }
        utmTerm: { type: string }

    SubmitLandingPageFormResult:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string }
        contactId: { type: string, nullable: true }
        leadId: { type: string, nullable: true }
        successMessage: { type: string, nullable: true }

    # ---------- Forms ----------
    FormFieldSchema:
      type: object
      required: [label, fieldKey, type]
      properties:
        id: { type: string }
        label: { type: string }
        fieldKey: { type: string, pattern: '^[a-z0-9_]+$' }
        type: { type: string, enum: [TEXT, EMAIL, PHONE, TEXTAREA, SELECT, CHECKBOX, HIDDEN] }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }
          nullable: true
        order: { type: integer, default: 0 }

    Form:
      type: object
      required: [id, businessId, name, submitLabel, fields, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        submitLabel: { type: string }
        successMessage: { type: string, nullable: true }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormFieldSchema' }
        createdAt: { type: string, format: date-time }

    CreateFormInput:
      type: object
      required: [name, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        submitLabel: { type: string }
        successMessage: { type: string }
        fields:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FormFieldSchema' }

    UpdateFormInput:
      type: object
      properties:
        name: { type: string }
        submitLabel: { type: string }
        successMessage: { type: string, nullable: true }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormFieldSchema' }

    FormSubmission:
      type: object
      required: [id, businessId, formId, data, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        formId: { type: string }
        landingPageId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        leadId: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
        sessionId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------- Ad Units (first-party) ----------
    AdUnit:
      type: object
      required:
        [
          id,
          businessId,
          campaignId,
          creativeId,
          format,
          status,
          impressions,
          clicks,
          conversions,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        campaignId: { type: string }
        creativeId: { type: string }
        format: { type: string, enum: [DISPLAY_BANNER, NATIVE, EMBED] }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl: { type: string, nullable: true }
        servingConfig: { type: object, nullable: true, additionalProperties: true }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        lastServedAt: { type: string, format: date-time, nullable: true }
        serveUrl:
          type: string
          description: Ad-server embed endpoint for this unit (apps/ad-server — a separate deployable service).
        createdAt: { type: string, format: date-time }

    CreateAdUnitInput:
      type: object
      required: [campaignId, creativeId, format]
      properties:
        campaignId: { type: string }
        creativeId: { type: string }
        format: { type: string, enum: [DISPLAY_BANNER, NATIVE, EMBED] }
        destinationLandingPageId: { type: string }
        destinationUrl: { type: string }
        servingConfig: { type: object, additionalProperties: true }

    UpdateAdUnitInput:
      type: object
      properties:
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl: { type: string, nullable: true }
        servingConfig: { type: object, additionalProperties: true }

    # ---------- Lead / Sale / Interaction ----------
    Lead:
      type: object
      required: [id, businessId, contactId, stage, sourceType, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        contactId: { type: string }
        stage: { type: string, enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST] }
        owner: { type: string, nullable: true }
        estimatedValue: { type: number, nullable: true }
        sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_RUN, AD_UNIT, MANUAL, IMPORT] }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdRunId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        clickId: { type: string, nullable: true }
        landingSessionId: { type: string, nullable: true }
        referringAffiliateId:
          type: string
          nullable: true
          description: >
            Separate from sourceType above — sourceType answers "how did this lead reach us"
            (message/deployment/ad-unit/manual/import); this answers "which affiliate gets
            credit," set independently by the same submission and orthogonal to it.
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UpdateLeadInput:
      type: object
      properties:
        stage: { type: string, enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST] }
        owner: { type: string, nullable: true }
        estimatedValue: { type: number, nullable: true }

    Sale:
      type: object
      required: [id, businessId, contactId, amount, date, sourceType, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        contactId: { type: string }
        leadId: { type: string, nullable: true }
        amount: { type: number }
        date: { type: string, format: date-time }
        productOrService: { type: string, nullable: true }
        sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_RUN, AD_UNIT, MANUAL, IMPORT] }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdRunId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        idempotencyKey:
          type: string
          nullable: true
          description: >
            Client-supplied dedup key from CreateSaleInput. Nullable only because a handful of
            Sale rows predate this field; every sale created going forward has one.
        reversedAt:
          type: string
          format: date-time
          nullable: true
          description: Set by POST /sales/{saleId}/reverse. Not a status enum — matches Lead.closedAt/Automation.pausedAt.
        createdAt: { type: string, format: date-time }

    ReverseSaleInput:
      type: object
      properties:
        reason: { type: string }

    CreateSaleInput:
      type: object
      required: [contactId, amount, date, idempotencyKey]
      properties:
        contactId: { type: string }
        leadId: { type: string }
        amount: { type: number, minimum: 0 }
        date: { type: string, format: date-time }
        productOrService: { type: string }
        notes: { type: string }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Client-generated once per sale-recording attempt and resent unchanged on any retry —
            a retried request or a double-submitted form returns the original Sale instead of
            recording the economic event twice. Same convention as every finance-writing endpoint
            (RecordFundingInput, ApplyCreditInput, etc.).

    Interaction:
      type: object
      required: [id, contactId, type, occurredAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        type:
          type: string
          enum:
            [
              EMAIL_SENT,
              TEXT_SENT,
              SOCIAL_POST_SENT,
              REPLY,
              CALL_LOGGED,
              NOTE,
              STATUS_CHANGE,
              QUOTE_SENT,
              SALE_RECORDED,
              AD_CLICK,
              FORM_SUBMITTED,
              PAGE_VIEWED,
            ]
        sourceType:
          {
            type: string,
            enum: [MESSAGE, DEPLOYMENT, AD_RUN, AD_UNIT, MANUAL, IMPORT],
            nullable: true,
          }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdRunId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        occurredAt: { type: string, format: date-time }

    # ---------- Attribution ----------
    SubmitFormInput:
      type: object
      required: [sessionId, name]
      properties:
        sessionId: { type: string, description: HMAC-signed visitor session token issued on click. }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string }

    SubmitFormResult:
      type: object
      properties:
        contactId: { type: string }
        leadId: { type: string }

    # ---------- Dashboards ----------
    HomeRail:
      type: object
      required:
        [localDate, timezone, currency, inboxWaiting, reach, responses, spend, leads, revenue]
      properties:
        localDate: { type: string, format: date }
        timezone: { type: string }
        currency: { type: string }
        inboxWaiting: { type: integer }
        inboxOldestAt: { type: string, format: date-time, nullable: true }
        reach: { type: integer }
        responses: { type: integer }
        spend: { type: number }
        leads: { type: integer }
        revenue: { type: number }

    HomeInboxItem:
      type: object
      required: [id, kind, contactId, contactName, waitingSince, actionLabel, href]
      properties:
        id: { type: string }
        kind: { type: string, enum: [MESSAGE, LEAD] }
        contactId: { type: string }
        contactName: { type: string }
        preview: { type: string, nullable: true }
        sourceLabel: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time }
        actionLabel: { type: string, enum: [Reply, Review Lead] }
        href: { type: string }

    HomeActivityItem:
      type: object
      required: [id, category, eventType, text, occurredAt, objectType, objectId, href]
      properties:
        id: { type: string }
        category: { type: string, enum: [PERSON, BUSINESS, NEEDS_ATTENTION] }
        eventType: { type: string }
        text: { type: string }
        detail: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        sourceLabel: { type: string, nullable: true }
        objectType: { type: string }
        objectId: { type: string }
        href: { type: string }
        actionLabel: { type: string, nullable: true }

    HomeSystemStatus:
      type: object
      required: [id, label, state, detail, href]
      properties:
        id: { type: string }
        label: { type: string }
        state:
          { type: string, enum: [CURRENT, ATTENTION, DEGRADED, DISCONNECTED, QUIET, NOT_SET_UP] }
        detail: { type: string }
        href: { type: string }

    LivePresenceStat:
      type: object
      required: [value, label]
      properties:
        value: { type: integer }
        label: { type: string }

    LivePresenceItem:
      type: object
      description: >
        A real, recently-active object from Pages, Advertising, or Messages, unioned and sorted by
        recency for the Home/collection "Live presence" grid — see docs/strategy's welcome-section
        redesign. Every stat is backed by real tracked data (page views, ad impressions, message
        recipient/lead counts) — no fabricated engagement/open-rate numbers.
      required: [type, id, title, href, updatedAt, statusLabel, thumbnailUrl, stat1, stat2]
      properties:
        type: { type: string, enum: [PAGE, AD, MESSAGE] }
        channel: { type: string, enum: [EMAIL, SOCIAL], nullable: true }
        id: { type: string }
        title: { type: string }
        href: { type: string }
        updatedAt: { type: string, format: date-time }
        statusLabel: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        stat1: { $ref: '#/components/schemas/LivePresenceStat' }
        stat2: { $ref: '#/components/schemas/LivePresenceStat' }

    WeeklyMetric:
      type: object
      required: [value, previousValue, deltaPct]
      properties:
        value: { type: number }
        previousValue: { type: number, description: The same measure for the prior week — shown alongside deltaPct so the comparison isn't hidden behind a percentage alone. }
        deltaPct:
          type: number
          nullable: true
          description: Percent change vs. the prior week. Null when there's no prior-week baseline to compare against (never a fabricated 0%/Infinity).

    WeeklyResults:
      type: object
      required: [leads, customers, revenue, messagesSent]
      properties:
        leads: { $ref: '#/components/schemas/WeeklyMetric' }
        customers: { $ref: '#/components/schemas/WeeklyMetric' }
        revenue: { $ref: '#/components/schemas/WeeklyMetric' }
        messagesSent: { $ref: '#/components/schemas/WeeklyMetric' }

    HomeSummary:
      type: object
      required: [businessName, generatedAt, brief, rail, inbox, activity, systems, livePresence, weeklyResults]
      properties:
        businessName: { type: string }
        generatedAt: { type: string, format: date-time }
        brief: { type: string }
        primaryAction:
          type: object
          nullable: true
          required: [id, title, reason, actionLabel, href]
          properties:
            id: { type: string }
            title: { type: string }
            reason: { type: string }
            actionLabel: { type: string }
            href: { type: string }
        rail: { $ref: '#/components/schemas/HomeRail' }
        inbox:
          type: object
          required: [totalWaiting, items]
          properties:
            totalWaiting: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/HomeInboxItem' }
        activity:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/HomeActivityItem' }
        systems:
          type: array
          items: { $ref: '#/components/schemas/HomeSystemStatus' }
        livePresence:
          type: array
          items: { $ref: '#/components/schemas/LivePresenceItem' }
        weeklyResults: { $ref: '#/components/schemas/WeeklyResults' }
        newLeads: { type: integer }
        unansweredReplies: { type: integer }
        followUpsDue: { type: integer }
        failedSends: { type: integer }
        automationErrors: { type: integer }

    ResultsSummary:
      type: object
      properties:
        totalSpend: { type: number }
        totalLeads: { type: integer }
        totalSales: { type: integer }
        totalRevenue: { type: number }
        blendedCpl: { type: number, nullable: true }
        funnel:
          type: object
          properties:
            views: { type: integer }
            clicks: { type: integer }
            leads: { type: integer }
            sales: { type: integer }
        bySource:
          type: array
          items:
            type: object
            properties:
              sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_RUN, AD_UNIT] }
              sourceId: { type: string }
              label: { type: string }
              leads: { type: integer }
              sales: { type: integer }
              revenue: { type: number }
              spend: { type: number, nullable: true }

    # ---------- Finance / Ledger ----------
    MoneyMetadata:
      type: object
      additionalProperties: true
      nullable: true

    LedgerEntry:
      type: object
      required: [id, accountId, direction, amountMinor, currency]
      properties:
        id: { type: string }
        accountId: { type: string }
        campaignId: { type: string, nullable: true }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amountMinor: { type: integer }
        currency: { type: string }

    LedgerTransaction:
      type: object
      required:
        [id, businessId, currency, type, status, idempotencyKey, postedAt, createdAt, entries]
      properties:
        id: { type: string }
        businessId: { type: string }
        currency: { type: string }
        type:
          type: string
          enum:
            [
              CLIENT_FUNDING,
              CREDIT,
              REFUND,
              REVERSAL,
              BUDGET_RESERVE,
              AD_SPEND,
              AD_SPEND_SETTLEMENT,
              LOOPIE_FEE,
              SERVICE_PAYMENT,
              COMMISSION,
              PAYOUT,
              ADJUSTMENT,
            ]
        status: { type: string, enum: [POSTED] }
        idempotencyKey: { type: string }
        externalRef: { type: string, nullable: true }
        externalProvider:
          {
            type: string,
            nullable: true,
            description: 'STRIPE, META, GOOGLE, or MANUAL. A reference, not the books.',
          }
        metadata: { $ref: '#/components/schemas/MoneyMetadata' }
        reversesTransactionId: { type: string, nullable: true }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }

    FinancialAccount:
      type: object
      required: [id, businessId, kind, currency, name, balanceMinor]
      properties:
        id: { type: string }
        businessId: { type: string }
        kind:
          type: string
          enum:
            [
              CLIENT_AD_FUNDS,
              CLIENT_FUNDS_RESERVED,
              LOOPIE_CASH,
              PROCESSOR_CLEARING,
              AD_PLATFORM_CLEARING,
              LOOPIE_REVENUE,
              AFFILIATE_PAYABLE,
              REFUNDS_CREDITS,
            ]
        currency: { type: string }
        name: { type: string }
        balanceMinor: { type: integer, description: Derived from ledger entries. Never stored. }

    Payment:
      type: object
      required:
        [
          id,
          businessId,
          amountMinor,
          currency,
          status,
          idempotencyKey,
          ledgerTransactionId,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [POSTED, REFUNDED, FAILED] }
        processor: { type: string, nullable: true }
        externalRef:
          {
            type: string,
            nullable: true,
            description: Canonical processor payment id. For Stripe subscriptions this is the invoice id.,
          }
        stripePaymentIntentId: { type: string, nullable: true }
        stripeChargeId: { type: string, nullable: true }
        idempotencyKey: { type: string }
        ledgerTransactionId: { type: string }
        createdAt: { type: string, format: date-time }

    Refund:
      type: object
      required:
        [
          id,
          businessId,
          amountMinor,
          currency,
          status,
          idempotencyKey,
          ledgerTransactionId,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        paymentId: { type: string, nullable: true }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [POSTED] }
        reason: { type: string, nullable: true }
        idempotencyKey: { type: string }
        ledgerTransactionId: { type: string }
        createdAt: { type: string, format: date-time }

    BudgetAuthorization:
      type: object
      required: [id, businessId, currency, authorizedAmountMinor, status, idempotencyKey, createdAt]
      description: >
        Exactly one of campaignId/adRunId is set — campaignId is the legacy path (every existing
        row), adRunId is the standalone-AdRun path added by the Media/Advertisement/AdRun
        migration (see CLAUDE.md) so an AdRun can be funded without a parent Campaign.
      properties:
        id: { type: string }
        businessId: { type: string }
        campaignId: { type: string, nullable: true }
        adRunId: { type: string, nullable: true }
        currency: { type: string }
        authorizedAmountMinor: { type: integer }
        status: { type: string, enum: [ACTIVE, RELEASED] }
        idempotencyKey: { type: string }
        ledgerTransactionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CampaignFunding:
      type: object
      required:
        [
          campaignId,
          currency,
          planningBudget,
          authorizedAmountMinor,
          reservedAmountMinor,
          platformReportedAmountMinor,
          settledAmountMinor,
          clientAvailableAmountMinor,
        ]
      properties:
        campaignId: { type: string }
        currency: { type: string }
        planningBudget:
          {
            type: number,
            description: 'Campaign.budget is operational planning only, not the financial source of truth.',
          }
        authorizedAmountMinor: { type: integer }
        reservedAmountMinor: { type: integer }
        platformReportedAmountMinor: { type: integer }
        settledAmountMinor: { type: integer }
        clientAvailableAmountMinor: { type: integer }

    CampaignLead:
      type: object
      required:
        [id, contactId, contactName, acquiredAt, stage, sourceType, sourceLabel, followUpStatus]
      description: >
        Campaign-scoped outcome row. Not a second CRM — clicking through goes to Contact detail.
      properties:
        id: { type: string }
        contactId: { type: string }
        contactName: { type: string }
        acquiredAt: { type: string, format: date-time }
        stage: { type: string, enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST] }
        sourceType: { type: string, enum: [DEPLOYMENT, AD_RUN, AD_UNIT] }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE], nullable: true }
        creativeName: { type: string, nullable: true }
        sourceLabel: { type: string }
        attributedValue: { type: number, nullable: true }
        lastInteractionType: { type: string, nullable: true }
        lastInteractionAt: { type: string, format: date-time, nullable: true }
        followUpStatus: { type: string, enum: [NONE, SCHEDULED, DUE, SENT, STOPPED] }
        followUpAt: { type: string, format: date-time, nullable: true }

    AdSpend:
      type: object
      required:
        [
          id,
          businessId,
          platform,
          externalChargeId,
          periodStart,
          periodEnd,
          currency,
          reportedAmountMinor,
          settledAmountMinor,
          settlementStatus,
          idempotencyKey,
          createdAt,
        ]
      description: Exactly one of campaignId/adRunId is set — see BudgetAuthorization's description.
      properties:
        id: { type: string }
        businessId: { type: string }
        campaignId: { type: string, nullable: true }
        adRunId: { type: string, nullable: true }
        budgetAuthorizationId: { type: string, nullable: true }
        deploymentId: { type: string, nullable: true }
        adUnitId: { type: string, nullable: true }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        externalChargeId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        currency: { type: string }
        reportedAmountMinor: { type: integer }
        settledAmountMinor: { type: integer }
        settlementStatus: { type: string, enum: [REPORTED, RECONCILED, SETTLED, DISPUTED] }
        idempotencyKey: { type: string }
        ledgerTransactionId: { type: string, nullable: true }
        settlementTransactionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Commission:
      type: object
      required: [id, businessId, payeeRef, amountMinor, currency, status, idempotencyKey, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        payeeRef: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PAYABLE, PAID, CANCELLED, REVERSED] }
        sourceRef: { type: string, nullable: true }
        idempotencyKey: { type: string }
        ledgerTransactionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Payout:
      type: object
      required:
        [
          id,
          businessId,
          payeeRef,
          amountMinor,
          currency,
          status,
          idempotencyKey,
          commissionIds,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        payeeRef: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [PENDING, TRANSFERRED, PAID, FAILED, REVERSED] }
        idempotencyKey: { type: string }
        ledgerTransactionId:
          {
            type: string,
            nullable: true,
            description: 'Set when the PAYOUT ledger posts at TRANSFERRED (Connect) or immediately at PAID (manual).',
          }
        stripeTransferId:
          {
            type: string,
            nullable: true,
            description: "Connect Transfer to the affiliate's Stripe account. TRANSFERRED is this movement.",
          }
        stripePayoutId:
          {
            type: string,
            nullable: true,
            description: 'Connected-account Payout to bank. PAID is this movement, not the Transfer.',
          }
        commissionIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    Reconciliation:
      type: object
      required:
        [
          id,
          businessId,
          currency,
          trackedAmountMinor,
          platformReportedAmountMinor,
          settledAmountMinor,
          discrepancyMinor,
          status,
          idempotencyKey,
          createdAt,
        ]
      properties:
        id: { type: string }
        businessId: { type: string }
        campaignId: { type: string, nullable: true }
        adRunId: { type: string, nullable: true }
        adSpendId: { type: string, nullable: true }
        currency: { type: string }
        trackedAmountMinor: { type: integer }
        platformReportedAmountMinor: { type: integer }
        settledAmountMinor: { type: integer }
        discrepancyMinor: { type: integer }
        status: { type: string, enum: [MATCHED, DISCREPANCY, RESOLVED] }
        notes: { type: string, nullable: true }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }

    RecordFundingInput:
      type: object
      required: [amountMinor, currency, idempotencyKey]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        externalRef: { type: string }
        processor: { type: string }
        metadata: { type: object, additionalProperties: true }

    ApplyCreditInput:
      type: object
      required: [amountMinor, currency, idempotencyKey]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string }
        metadata: { type: object, additionalProperties: true }

    IssueRefundInput:
      type: object
      required: [amountMinor, currency, idempotencyKey, paymentId]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        paymentId: { type: string }
        reason: { type: string }
        metadata: { type: object, additionalProperties: true }

    ReverseTransactionInput:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string }

    AuthorizeBudgetInput:
      type: object
      required: [amountMinor, currency, idempotencyKey]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        metadata: { type: object, additionalProperties: true }

    RecordAdSpendInput:
      type: object
      required:
        [
          campaignId,
          amountMinor,
          currency,
          platform,
          externalChargeId,
          periodStart,
          periodEnd,
          idempotencyKey,
        ]
      properties:
        campaignId: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        externalChargeId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        deploymentId: { type: string }
        adUnitId: { type: string }
        metadata: { type: object, additionalProperties: true }

    SettleAdSpendInput:
      type: object
      required: [settledAmountMinor, idempotencyKey]
      properties:
        settledAmountMinor: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }

    RecordFeeInput:
      type: object
      required: [amountMinor, currency, idempotencyKey, campaignId]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        campaignId: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }

    CreateCommissionInput:
      type: object
      required: [amountMinor, currency, payeeRef, idempotencyKey]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        payeeRef: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        sourceRef: { type: string }
        metadata: { type: object, additionalProperties: true }

    MarkCommissionPayableInput:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }

    CreatePayoutInput:
      type: object
      required: [commissionIds, payeeRef, idempotencyKey]
      properties:
        commissionIds:
          type: array
          items: { type: string }
          minItems: 1
        payeeRef: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        metadata: { type: object, additionalProperties: true }

    ReconcileAdSpendInput:
      type: object
      required:
        [
          adSpendId,
          trackedAmountMinor,
          platformReportedAmountMinor,
          settledAmountMinor,
          idempotencyKey,
        ]
      properties:
        adSpendId: { type: string }
        trackedAmountMinor: { type: integer, minimum: 0 }
        platformReportedAmountMinor: { type: integer, minimum: 0 }
        settledAmountMinor: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string }

    ActivitySource:
      type: string
      enum: [LOOPIE, PLATFORM, WEBSITE, CHANNEL, USER, AUTOMATION]

    ActivityType:
      type: string
      enum: [FORM_SUBMISSION, LEAD_CREATED, AD_RUN_FAILED, MESSAGE_REPLY, STATUS_CHANGE, PUBLISH, SALE, PAYMENT, AUTOMATION_EXECUTION, SYNC, IDENTITY_MATCH, BROADCAST]

    AttentionState:
      type: string
      enum: [NEEDS_ACTION, IN_PROGRESS, SNOOZED, RESOLVED]

    AttentionItem:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/AttentionState' }
        assigneeId: { type: string, nullable: true }
        priority: { type: string, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        snoozedUntil: { type: string, format: date-time, nullable: true }

    ActivityAction:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string, nullable: true }
        command: { type: string, nullable: true }

    ActivityAggregation:
      type: object
      required: [key, count, windowStart, windowEnd]
      properties:
        key: { type: string }
        count: { type: integer }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }

    ActivityItem:
      type: object
      required: [id, businessId, taxonomyVersion, occurredAt, observedAt, projectedAt, storyId, source, type, actor, attention, summary, references, actions]
      properties:
        id: { type: string }
        businessId: { type: string }
        taxonomyVersion: { type: string }
        occurredAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        projectedAt: { type: string, format: date-time }
        storyId: { type: string }
        source:
          type: object
          required: [kind, label]
          properties:
            kind: { $ref: '#/components/schemas/ActivitySource' }
            id: { type: string, nullable: true }
            label: { type: string }
            accountId: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/ActivityType' }
        actor:
          type: object
          required: [kind, label]
          properties:
            kind: { type: string, enum: [CONTACT, USER, SYSTEM, AUTOMATION] }
            id: { type: string, nullable: true }
            label: { type: string }
        status: { type: string, nullable: true }
        attention: { type: string, enum: [INFORMATION, ACTION_REQUIRED, FAILURE] }
        summary: { type: string }
        detail: { type: string, nullable: true }
        references:
          type: object
          properties:
            personId: { type: string, nullable: true }
            leadId: { type: string, nullable: true }
            adId: { type: string, nullable: true }
            runId: { type: string, nullable: true }
            pageId: { type: string, nullable: true }
            formId: { type: string, nullable: true }
            messageId: { type: string, nullable: true }
            broadcastId: { type: string, nullable: true }
            saleId: { type: string, nullable: true }
        aggregation: { $ref: '#/components/schemas/ActivityAggregation', nullable: true }
        attentionItem: { $ref: '#/components/schemas/AttentionItem', nullable: true }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActivityAction' }


paths:
  # ---------- Activity ----------
  /activity:
    get:
      operationId: getActivityStream
      summary: Get the Activity stream
      tags: [activity]
      parameters:
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: personId
          schema: { type: string }
        - in: query
          name: adId
          schema: { type: string }
        - in: query
          name: pageId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: needsAction
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated Activity items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityItem' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  /activity/health:
    get:
      operationId: getActivityHealth
      summary: Get projection health (unresolved failures)
      tags: [activity]
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                required: [unresolvedFailures, status]
                properties:
                  unresolvedFailures: { type: integer }
                  status: { type: string }

  /activity/checkpoint:
    get:
      operationId: getActivityCheckpoint
      summary: Get latest observed time for new item notices
      tags: [activity]
      responses:
        '200':
          description: Latest observedAt timestamp
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [observedAt]
                    properties:
                      observedAt: { type: string, format: date-time }

  /activity/{activityId}:
    get:
      operationId: getActivityItem
      summary: Get a single Activity item
      tags: [activity]
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Detailed Activity item
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ActivityItem' }

  /activity/attention/{attentionId}:
    patch:
      operationId: updateAttentionItem
      summary: Mutate an AttentionItem
      tags: [activity]
      parameters:
        - $ref: '#/components/parameters/AttentionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { $ref: '#/components/schemas/AttentionState' }
                assigneeId: { type: string, nullable: true }
                priority: { type: string, nullable: true }
                snoozedUntil: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Updated AttentionItem
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttentionItem' }



  # ---------- Auth ----------
  /auth/register:
    post:
      operationId: register
      summary: Register
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/login:
    post:
      operationId: login
      summary: Login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      tags: [auth]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  # ---------- Business ----------
  /business:
    get:
      operationId: getBusiness
      summary: Get business profile
      description: 'The current user''s business identity/profile — see docs/strategy/03-product-principles.md''s Singleton, Collection, Entity grammar (Business Profile is the one Singleton).'
      tags: [business]
      responses:
        '200':
          description: Business profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Business' }
    patch:
      operationId: updateBusiness
      summary: Update business profile
      description: 'Used both for first-login setup and later edits — the same object, always editable. Stamps identityCompletedAt on first save.'
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusinessInput' }
      responses:
        '200':
          description: Updated business profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Business' }

  # ---------- Contacts ----------
  /contacts:
    get:
      operationId: listContacts
      summary: List contacts
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: lifecycleStatus
          schema: { type: string, enum: [LEAD, CUSTOMER, PAST_CUSTOMER, NONE] }
        - in: query
          name: source
          description: Return contacts whose first-seen source matches this value.
          schema: { type: string }
      responses:
        '200':
          description: Paginated contacts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createContact
      summary: Create contact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactInput' }
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }

  /contacts/import:
    post:
      operationId: importContacts
      summary: Import contacts from CSV or JSON
      description: >
        Body is a JSON array of people (max 5000). The Import page accepts a
        .csv or .json file (or pasted text) and maps headers/keys onto
        ImportContactInput, including HubSpot-style aliases such as first_name.
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportContactsInput' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportContactsResult' }

  /integrations/catalog:
    get:
      operationId: listCrmCatalog
      summary: CRM provider catalog and capabilities
      tags: [crm]
      responses:
        '200':
          description: Providers LOOPIE can connect
          content:
            application/json:
              schema:
                type: object
                required: [data, unresolvedMatchCount]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CrmCatalogEntry' }
                  unresolvedMatchCount: { type: integer }

  /integrations:
    get:
      operationId: listIntegrations
      summary: List CRM integrations
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated integrations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createIntegration
      summary: Stub-connect a provider when OAuth env is unset
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationInput' }
      responses:
        '201':
          description: Integration connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Integration' }

  /integrations/{integrationId}:
    get:
      operationId: getIntegration
      summary: Get a CRM integration
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Integration' }
    patch:
      operationId: updateIntegration
      summary: Pause or update a CRM integration
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntegrationInput' }
      responses:
        '200':
          description: Integration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Integration' }

  /integrations/{integrationId}/disconnect:
    post:
      operationId: disconnectIntegration
      summary: Remove stored access to a CRM integration
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Integration access removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Integration' }

  /integrations/{provider}/oauth/start:
    get:
      operationId: startCrmOAuth
      summary: Start CRM provider OAuth
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/CrmProviderParam'
        - in: query
          name: returnPath
          schema: { type: string }
        - in: query
          name: shop
          schema: { type: string }
          description: Required for Shopify (store subdomain or myshopify.com host)
      responses:
        '200':
          description: Vendor authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OAuthStart' }

  /integrations/{provider}/oauth/callback:
    get:
      operationId: handleCrmOAuthCallback
      summary: CRM OAuth callback
      tags: [crm]
      security: []
      parameters:
        - $ref: '#/components/parameters/CrmProviderParam'
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        '302':
          description: Stores the token and redirects to the web app
          headers:
            Location: { schema: { type: string } }

  /integrations/{integrationId}/sync:
    post:
      operationId: syncIntegration
      summary: Pull inbound contacts and orders from a connected provider
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Sync counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SyncIntegrationResult' }

  /external-events:
    post:
      operationId: ingestExternalEvent
      summary: Ingest a CRM or commerce event
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestExternalEventInput' }
      responses:
        '201':
          description: Event stored; orders/payments may materialize a Sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExternalEvent' }

  /contact-matches:
    get:
      operationId: listContactMatches
      summary: Unmatched and ambiguous external contact records
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema: { type: string, enum: [UNMATCHED, AMBIGUOUS] }
      responses:
        '200':
          description: Records needing review
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalContactRecord' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  /contact-matches/{recordId}/resolve:
    post:
      operationId: resolveContactMatch
      summary: Link an ambiguous or unmatched external record to a Contact
      tags: [crm]
      parameters:
        - $ref: '#/components/parameters/ExternalRecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveContactMatchInput' }
      responses:
        '200':
          description: Record linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExternalContactRecord' }

  /t/session:
    get:
      operationId: getLoopieSession
      summary: Mint or reuse a first-touch LOOPIE tracking session
      tags: [tracking]
      security: []
      parameters:
        - in: query
          name: businessId
          required: true
          schema: { type: string }
        - in: query
          name: sid
          schema: { type: string }
        - in: query
          name: adRunId
          schema: { type: string }
        - in: query
          name: deploymentId
          schema: { type: string }
        - in: query
          name: gclid
          schema: { type: string }
        - in: query
          name: fbclid
          schema: { type: string }
        - in: query
          name: ttclid
          schema: { type: string }
        - in: query
          name: click_id
          schema: { type: string }
        - in: query
          name: utm_source
          schema: { type: string }
        - in: query
          name: utm_medium
          schema: { type: string }
        - in: query
          name: utm_campaign
          schema: { type: string }
        - in: query
          name: utm_content
          schema: { type: string }
        - in: query
          name: utm_term
          schema: { type: string }
      responses:
        '200':
          description: Signed session token; first-touch fields are retained
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LoopieRuntimeSession' }

  /t/events:
    post:
      operationId: trackLoopieEvent
      summary: Record a portable page/form event
      tags: [tracking]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackRuntimeEventInput' }
      responses:
        '204':
          description: Recorded

  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Get contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    patch:
      operationId: updateContact
      summary: Update contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactInput' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    delete:
      operationId: deleteContact
      summary: Delete contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }

  /contacts/{contactId}/interactions:
    get:
      operationId: listContactInteractions
      summary: List contact interactions
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated interaction timeline
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Interaction' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  # ---------- Audiences ----------
  /audiences:
    get:
      operationId: listAudiences
      summary: List audiences
      tags: [audiences]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated audiences
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Audience' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createAudience
      summary: Create audience
      tags: [audiences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAudienceInput' }
      responses:
        '201':
          description: Audience created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Audience' }

  /audiences/{audienceId}:
    get:
      operationId: getAudience
      summary: Get audience
      tags: [audiences]
      parameters:
        - $ref: '#/components/parameters/AudienceId'
      responses:
        '200':
          description: Audience with live member/eligible counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Audience' }
    patch:
      operationId: updateAudience
      summary: Update audience
      tags: [audiences]
      parameters:
        - $ref: '#/components/parameters/AudienceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAudienceInput' }
      responses:
        '200':
          description: Updated audience
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Audience' }
    delete:
      operationId: deleteAudience
      summary: Delete audience
      tags: [audiences]
      parameters:
        - $ref: '#/components/parameters/AudienceId'
      responses:
        '200':
          description: Audience deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }

  /audiences/{audienceId}/contacts:
    get:
      operationId: listAudienceContacts
      summary: List audience contacts
      tags: [audiences]
      parameters:
        - $ref: '#/components/parameters/AudienceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated contacts resolved for this audience
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  # ---------- Assets ----------
  /assets:
    get:
      operationId: listAssets
      summary: List assets
      tags: [assets]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: type
          schema: { type: string, enum: [IMAGE, TEXT, VIDEO, AUDIO] }
      responses:
        '200':
          description: Paginated assets
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
