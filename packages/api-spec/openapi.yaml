          description: Paginated messages
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
