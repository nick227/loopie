          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/sync:
    post:
      operationId: syncAdRun
      summary: Pull the run's real provider status/spend/performance now
      description: >
        On-demand pull sync — fetches provider delivery state, spend, and performance for a
        run already sent to a platform, and persists them. Never mutates the platform; read-only.
        409s if the run has no externalAdId yet (nothing to pull).
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      responses:
        '200':
          description: Synced ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/budget:
    post:
      operationId: updateAdRunBudget
      summary: Request a real budget change at the platform
      description: >
        Capability-gated remote budget mutation (requires capabilities.editBudget). Freezes a new
        MediaOrderRevision before attempting the change; if the platform rejects it, that revision
        never becomes this run's effective one and AdRun.budget is left untouched. Resyncs
        immediately after a successful mutation so effectiveBudget reflects the platform's own
        confirmed value. 409s if this run has no external identity, the connector can't edit
        budget, or the business is currently disconnected — never silently edits only the local
        value for a run with a real external identity.
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyBudget]
              properties:
                dailyBudget:
                  type: number
                  minimum: 0.01
                  description: The new requested daily budget, in whole currency units.
      responses:
        '200':
          description: Updated ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/schedule:
    post:
      operationId: updateAdRunSchedule
      summary: Request a real schedule change at the platform
      description: >
        Capability-gated remote schedule mutation (requires capabilities.editSchedule). Freezes a
        new MediaOrderRevision before attempting the change; if the platform rejects it, that
        revision never becomes this run's effective one and AdRun.startDate/endDate are left
        untouched. Resyncs immediately after a successful mutation so effectiveStartDate/
        effectiveEndDate reflect the platform's own confirmed schedule. endDate omitted or null
        means an explicit no-end schedule. 409s if this run has no external identity, the
        connector can't edit schedule, or the business is currently disconnected — never silently
        edits only the local value for a run with a real external identity.
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate]
              properties:
                startDate:
                  type: string
                  format: date-time
                  description: The new requested start instant.
                endDate:
                  type: string
                  format: date-time
                  nullable: true
                  description: The new requested end instant, or null/omitted for no end date.
      responses:
        '200':
          description: Updated ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/targeting:
    post:
      operationId: updateAdRunTargeting
      summary: Request a real targeting change at the platform
      description: >
        Capability-gated remote targeting mutation (requires capabilities.editAudience). Freezes a
        new MediaOrderRevision before attempting the change; if the platform rejects it (including
        a location that can't be resolved to a real targetable spot), that revision never becomes
        this run's effective one and AdRun.country/locationNote/radiusMiles are left untouched.
        Resyncs immediately after a successful mutation so effectiveCountry/effectiveLocationNote/
        effectiveRadiusMiles reflect the platform's own confirmed targeting. Omitting locationNote
        means country-only targeting. 409s if this run has no external identity, the connector
        can't edit targeting, or the business is currently disconnected — never silently edits only
        the local value for a run with a real external identity.
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country]
              properties:
                country:
                  type: string
                  description: The new requested targeting country.
                locationNote:
                  type: string
                  nullable: true
                  description: A free-text location to resolve into a real radius-targeted spot, or null/omitted for country-only targeting.
                radiusMiles:
                  type: integer
                  nullable: true
                  description: Radius in miles around locationNote. Ignored when locationNote is null/omitted.
      responses:
        '200':
          description: Updated ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/replace-creative:
    post:
      operationId: replaceAdRunCreative
      summary: Replace this run's creative with a new provider execution
      description: >
        A RECREATE mutation, not an in-place edit (capabilities.editModes.creative is RECREATE for
        every connector today — Meta creatives are immutable at the API). Reuses the Advertisement's
        current attached assets — the same createAndProvision path a first send uses — to stand up
        a brand-new provider execution (new campaign/ad-set/ad, a fresh MediaOrderRevision at the
        next sequence number), then ends this run once the replacement's own send attempt has
        resolved (successful or not — a failed replacement must not silently strand the business
        with no visible run at all). The new run's supersedesRunId points back at this one. 400s if
        the Advertisement's current assets are identical to this run's last revision (nothing to
        replace).
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Client-generated once per replacement attempt and resent unchanged on any retry.
      responses:
        '201':
          description: The new, replacement ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

  /ad-runs/{adRunId}/replace-destination:
    post:
      operationId: replaceAdRunDestination
      summary: Replace this run's destination with a new provider execution
      description: >
        Same RECREATE contract as replace-creative (capabilities.editModes.destination is RECREATE
        — Meta's click-through URL lives inside the immutable creative, not as an independently
        editable field), but for the click destination instead of the media. 400s if the new
        destinationLandingPageId matches this run's last revision (nothing to replace).
      tags: [advertisements]
      parameters:
        - $ref: '#/components/parameters/AdRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationLandingPageId]
              properties:
                destinationLandingPageId: { type: string }
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Client-generated once per replacement attempt and resent unchanged on any retry.
      responses:
        '201':
          description: The new, replacement ad run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdRun' }

