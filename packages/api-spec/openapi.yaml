          schema: { type: string }
          description: >
            The originating ad platform's own click identifier (e.g. Meta's fbclid, Google's
            gclid), passed through unmodified into AttributionEvent.clickId for later
            attribution/reconciliation. Optional — omitted for platforms that don't append one.
      responses:
        '302':
          description: Records an AttributionEvent and redirects to the campaign destination URL
          headers:
            Location: { schema: { type: string } }

  /r/adrun/{adRunId}:
    get:
      operationId: trackAdRunClick
      summary: Track AdRun click
      tags: [attribution]
      security: []
      description: >
        Mirrors GET /r/{deploymentId} exactly (same session-mint/redirect/click_id shape) for the
        Advertisement/AdRun model — see CLAUDE.md's Media/Advertisement/AdRun migration audit.
        Additive alongside /r/{deploymentId}, not a replacement: existing Deployments keep using
        that route indefinitely, this one is for AdRuns.
      parameters:
        - $ref: '#/components/parameters/AdRunId'
        - in: query
          name: sid
          schema: { type: string }
          description: Anonymous session id, generated client-side if absent.
        - in: query
          name: click_id
          schema: { type: string }
          description: >
            The originating ad platform's own click identifier, passed through unmodified into
            AttributionEvent.clickId. Optional — omitted for platforms that don't append one.
      responses:
        '302':
          description: Records an AttributionEvent and redirects to the AdRun's destination
          headers:
            Location: { schema: { type: string } }

  /r/affiliate/{affiliateId}:
    get:
      operationId: trackAffiliateClick
      summary: Track affiliate referral click
      tags: [attribution]
      security: []
      description: >
        Mirrors GET /r/{deploymentId} exactly (same session-mint/redirect shape) for an
        affiliate's referral link. Records an AffiliateReferralClick, not an AttributionEvent —
        affiliate attribution is a separate mechanism from campaign/deployment tracking.
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
        - in: query
          name: sid
          schema: { type: string }
          description: Anonymous session id, generated client-side if absent.
      responses:
        '302':
          description: Records an AffiliateReferralClick and redirects to the affiliate's destination
          headers:
            Location: { schema: { type: string } }

  /attribution/form-submit:
    post:
      operationId: submitLeadForm
      summary: Submit lead form
      tags: [attribution]
      security: []
      description: >
        The identity-transition moment (docs/05-attribution-funnel-spec.md): resolves an
        anonymous sessionId into a Contact + Lead with sourceType = DEPLOYMENT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitFormInput' }
      responses:
        '201':
          description: Contact and Lead created/matched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubmitFormResult' }

