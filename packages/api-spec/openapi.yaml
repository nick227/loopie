          schema: { type: string, enum: [MESSAGE, DEPLOYMENT, MANUAL, IMPORT] }
      responses:
        '200':
          description: Paginated leads
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  /leads/{leadId}:
    get:
      operationId: getLead
      summary: Get lead
      tags: [leads]
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lead' }
    patch:
      operationId: updateLead
      summary: Update lead
      tags: [leads]
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLeadInput' }
      responses:
        '200':
          description: >
            Updated lead. Setting stage=WON prompts sale capture client-side and stops active
            follow-up automation (docs/07-sales-flow-spec.md); Customer status is derived, not stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lead' }

  /sales:
    get:
      operationId: listSales
      summary: List sales
      tags: [sales]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated sales
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sale' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createSale
      summary: Create sale
      tags: [sales]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSaleInput' }
      responses:
        '201':
          description: Sale recorded; contact lifecycle becomes CUSTOMER and linked Lead (if any) moves to WON
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }

  /sales/{saleId}:
    get:
      operationId: getSale
      summary: Get sale
      tags: [sales]
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }

