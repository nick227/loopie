          description: Message created as draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }

  /messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get message
      tags: [messages]
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
    patch:
      operationId: updateMessage
      summary: Update message
      tags: [messages]
      parameters:
