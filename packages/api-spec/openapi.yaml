openapi: 3.0.3
info:
  title: LOOPIE API
  version: 0.0.1
  description: >
    Unified messaging + advertising platform. Contract mirrors docs/00-unified-data-model.md:
    Campaign (paid) and Message (owned) are separate acquisition mechanisms that both feed one
    Contact -> Lead -> Sale -> Interaction spine via a source_type/source_id pointer.

servers:
  - url: http://localhost:3001
    description: Local dev

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      in: query
      name: q
      schema: { type: string, minLength: 1, maxLength: 200 }
    ContactId:
      in: path
      name: contactId
      required: true
      schema: { type: string }
    AudienceId:
      in: path
      name: audienceId
      required: true
      schema: { type: string }
    AssetId:
      in: path
      name: assetId
      required: true
      schema: { type: string }
    TemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string }
    CreativeId:
      in: path
      name: creativeId
      required: true
      schema: { type: string }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string }
    AutomationId:
      in: path
      name: automationId
      required: true
      schema: { type: string }
    CampaignId:
      in: path
      name: campaignId
      required: true
      schema: { type: string }
    DeploymentId:
      in: path
      name: deploymentId
      required: true
      schema: { type: string }
    LeadId:
      in: path
      name: leadId
      required: true
      schema: { type: string }
    SaleId:
      in: path
      name: saleId
      required: true
      schema: { type: string }
    LandingPageTemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string }
    LandingPageId:
      in: path
      name: landingPageId
      required: true
      schema: { type: string }
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string }
    FormId:
      in: path
      name: formId
      required: true
      schema: { type: string }
    AdUnitId:
      in: path
      name: adUnitId
      required: true
      schema: { type: string }

  schemas:
    PaginatedMeta:
      type: object
      required: [hasMore, nextCursor]
      properties:
        hasMore: { type: boolean }
        nextCursor: { type: string, nullable: true }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    # ---------- Auth ----------
    User:
      type: object
      required: [id, email, businessId, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        businessId: { type: string }
        businessName: { type: string }
        createdAt: { type: string, format: date-time }

    RegisterInput:
      type: object
      required: [email, password, businessName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        businessName: { type: string, minLength: 1, maxLength: 120 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    # ---------- Contact ----------
    ChannelEligibility:
      type: object
      properties:
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }

    Contact:
      type: object
      required: [id, businessId, name, createdAt, emailEligible, smsEligible]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        source: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }
        lastContactedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        # Derived, not stored: Lead / Customer / Past Customer — computed from Lead + Sale history.
        lifecycleStatus: { type: string, enum: [LEAD, CUSTOMER, PAST_CUSTOMER, NONE] }

    CreateContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean, default: true }
        smsEligible: { type: boolean, default: true }

    UpdateContactInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        emailEligible: { type: boolean }
        smsEligible: { type: boolean }

    ImportContactsInput:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items: { $ref: '#/components/schemas/CreateContactInput' }
          maxItems: 5000

    ImportContactsResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped: { type: integer }

    # ---------- Audience ----------
    Audience:
      type: object
      required: [id, businessId, name, type, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        type: { type: string, enum: [PREDEFINED, SAVED_FILTER, MANUAL_LIST, IMPORTED_LIST] }
        filter:
          type: object
          description: >
            Free-form filter used when type = SAVED_FILTER. Keys mirror
            docs/05-audience-segmentation-spec.md (leadStatus, hasEmail, hasMobile, tag,
            lastPurchaseBeforeDays, sourceCampaignId, sourceDeploymentId, ...).
          additionalProperties: true
          nullable: true
        memberCount: { type: integer }
        eligibleCount:
          type: integer
          description: Count respecting channel opt-out for the audience's intended channel.
        createdAt: { type: string, format: date-time }

    CreateAudienceInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [SAVED_FILTER, MANUAL_LIST, IMPORTED_LIST] }
        filter:
          type: object
          additionalProperties: true
        contactIds:
          type: array
          items: { type: string }
          description: Used when type = MANUAL_LIST or IMPORTED_LIST.

    UpdateAudienceInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filter:
          type: object
          additionalProperties: true

    # ---------- Asset ----------
    Asset:
      type: object
      required: [id, businessId, type, name, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        type: { type: string, enum: [IMAGE, TEXT, VIDEO, AUDIO] }
        name: { type: string }
        url: { type: string, nullable: true }
        textContent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAssetInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [IMAGE, TEXT, VIDEO, AUDIO] }
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string }
        textContent: { type: string }

    # ---------- Template ----------
    Template:
      type: object
      required: [id, businessId, name, channel, body, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        purpose: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        body: { type: string }
        mediaAssetId: { type: string, nullable: true }
        cta: { type: string, nullable: true }
        personalizationTokens:
          type: array
          items: { type: string }
        suggestedAudienceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateTemplateInput:
      type: object
      required: [name, channel, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        purpose: { type: string }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        mediaAssetId: { type: string }
        cta: { type: string }
        personalizationTokens:
          type: array
          items: { type: string }
        suggestedAudienceId: { type: string }

    UpdateTemplateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        subject: { type: string, nullable: true }
        body: { type: string, minLength: 1 }
        cta: { type: string, nullable: true }

    # ---------- Creative ----------
    Creative:
      type: object
      required: [id, businessId, name, version, assetIds, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        hostedUrl: { type: string, nullable: true }
        version: { type: integer }
        previousVersionId: { type: string, nullable: true }
        assetIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    CreateCreativeInput:
      type: object
      required: [name, assetIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        assetIds:
          type: array
          items: { type: string }
          minItems: 1

    UpdateCreativeInput:
      type: object
      required: [assetIds]
      description: >
        Any change creates a new immutable Creative version (docs/02-campaign-model-spec.md)
        rather than overwriting history; the response is the new version, chained via previousVersionId.
      properties:
        name: { type: string }
        assetIds:
          type: array
          items: { type: string }
          minItems: 1

    # ---------- Message ----------
    Message:
      type: object
      required: [id, businessId, channel, body, audienceId, status, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        subject: { type: string, nullable: true }
        body: { type: string }
        audienceId: { type: string }
        templateId: { type: string, nullable: true }
        automationId: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, SCHEDULED, SENT, FAILED] }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        recipientCount: { type: integer }
        createdAt: { type: string, format: date-time }

    CreateMessageInput:
      type: object
      required: [channel, body, audienceId]
      properties:
        channel: { type: string, enum: [EMAIL, TEXT, SOCIAL] }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        audienceId: { type: string }
        templateId: { type: string }
        automationId: { type: string }
        scheduledAt: { type: string, format: date-time }

    UpdateMessageInput:
      type: object
      properties:
        subject: { type: string, nullable: true }
        body: { type: string, minLength: 1 }
        audienceId: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }

    TestSendInput:
      type: object
      required: [toEmailOrPhone]
      properties:
        toEmailOrPhone: { type: string }

    MessagePerformance:
      type: object
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        replied: { type: integer }
        unsubscribed: { type: integer }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }

    # ---------- Automation ----------
    Automation:
      type: object
      required: [id, businessId, name, trigger, action, isActive, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        trigger:
          type: string
          enum: [MESSAGE_SENT, CONTACT_REPLIES, LEAD_CREATED, LEAD_STATUS_CHANGED, SALE_RECORDED, DATE_REACHED]
          description: >
            LEAD_CREATED fires regardless of source_type (message reply or campaign deployment) —
            see docs/00-unified-data-model.md "Resolved: Campaign and Message Stay Distinct Domain Concepts".
        waitDays: { type: integer, nullable: true }
        condition:
          type: string
          nullable: true
          enum: [HAS_REPLIED, HAS_NOT_REPLIED, LEAD_STILL_OPEN, LEAD_REACHED_STAGE, CUSTOMER_STATUS, CHANNEL_ELIGIBILITY]
        conditionValue:
          type: object
          additionalProperties: true
          nullable: true
        action:
          type: string
          enum: [SEND_EMAIL, SEND_TEXT, CREATE_REMINDER, CHANGE_LEAD_STATUS, NOTIFY_USER, STOP_SEQUENCE]
        actionTemplateId: { type: string, nullable: true }
        actionValue:
          type: object
          additionalProperties: true
          nullable: true
        isActive: { type: boolean }
        pausedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAutomationInput:
      type: object
      required: [name, trigger, action]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        trigger:
          type: string
          enum: [MESSAGE_SENT, CONTACT_REPLIES, LEAD_CREATED, LEAD_STATUS_CHANGED, SALE_RECORDED, DATE_REACHED]
        waitDays: { type: integer, minimum: 0, maximum: 30 }
        condition:
          type: string
          enum: [HAS_REPLIED, HAS_NOT_REPLIED, LEAD_STILL_OPEN, LEAD_REACHED_STAGE, CUSTOMER_STATUS, CHANNEL_ELIGIBILITY]
        conditionValue:
          type: object
          additionalProperties: true
        action:
          type: string
          enum: [SEND_EMAIL, SEND_TEXT, CREATE_REMINDER, CHANGE_LEAD_STATUS, NOTIFY_USER, STOP_SEQUENCE]
        actionTemplateId: { type: string }
        actionValue:
          type: object
          additionalProperties: true

    UpdateAutomationInput:
      type: object
      properties:
        name: { type: string }
        waitDays: { type: integer, minimum: 0, maximum: 30 }
        actionTemplateId: { type: string, nullable: true }

    AutomationLog:
      type: object
      required: [id, automationId, contactId, action, outcome, triggeredAt]
      properties:
        id: { type: string }
        automationId: { type: string }
        contactId: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [SENT, SKIPPED, FAILED] }
        reasonSkipped: { type: string, nullable: true }
        triggeredAt: { type: string, format: date-time }

    # ---------- Campaign / Deployment ----------
    Campaign:
      type: object
      required: [id, businessId, name, budget, startDate, status, platforms, creativeIds, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        budget: { type: number }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        destinationUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        platforms:
          type: array
          items: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
        creativeIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    CreateCampaignInput:
      type: object
      required: [name, budget, startDate, platforms, creativeIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        budget: { type: number, minimum: 0 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        destinationUrl: { type: string }
        platforms:
          type: array
          items: { type: string, enum: [META, GOOGLE, TIKTOK, LOOPIE] }
          minItems: 1
          description: >
            LOOPIE creates first-party AdUnit rows (served by apps/ad-server), not
            Deployment rows. META/GOOGLE/TIKTOK create Deployment rows.
        creativeIds:
          type: array
          items: { type: string }
          minItems: 1

    UpdateCampaignInput:
      type: object
      properties:
        name: { type: string }
        budget: { type: number, minimum: 0 }
        endDate: { type: string, format: date-time, nullable: true }
        destinationUrl: { type: string }
        creativeIds:
          type: array
          items: { type: string }

    Deployment:
      type: object
      required: [id, campaignId, creativeId, platform, status, spend, impressions, clicks, conversions, createdAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        creativeId: { type: string }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK] }
        externalCampaignId: { type: string, nullable: true }
        externalAdSetId: { type: string, nullable: true }
        externalAdId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED] }
        spend: { type: number }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        destinationLandingPageId:
          type: string
          nullable: true
          description: When set, GET /r/{deploymentId} redirects here instead of the campaign's destinationUrl.
        trackedUrl:
          type: string
          description: Redirect URL for this deployment — GET /r/{deploymentId}.
        createdAt: { type: string, format: date-time }

    CreateDeploymentInput:
      type: object
      required: [creativeId, platform]
      properties:
        creativeId: { type: string }
        platform: { type: string, enum: [META, GOOGLE, TIKTOK] }
        externalCampaignId: { type: string }
        externalAdSetId: { type: string }
        externalAdId: { type: string }
        destinationLandingPageId: { type: string }

    UpdateDeploymentInput:
      description: V1 has no live platform sync — spend/status/metrics are entered manually (Parking lot — see MVP Definition).
      type: object
      properties:
        status: { type: string, enum: [PENDING, ACTIVE, PAUSED, ENDED] }
        spend: { type: number, minimum: 0 }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        conversions: { type: integer, minimum: 0 }
        destinationLandingPageId: { type: string, nullable: true }

    CampaignPerformance:
      type: object
      properties:
        spend: { type: number }
        views: { type: integer }
        clicks: { type: integer }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }
        cpl: { type: number, nullable: true }
        byCreative:
          type: array
          items:
            type: object
            properties:
              creativeId: { type: string }
              creativeName: { type: string }
              views: { type: integer }
              clicks: { type: integer }
              leads: { type: integer }
              sales: { type: integer }
        byPlatform:
          type: array
          description: Includes a LOOPIE row whenever the campaign has AdUnits with recorded activity, alongside external platforms.
          items:
            type: object
            properties:
              platform: { type: string }
              spend: { type: number }
              leads: { type: integer }
              sales: { type: integer }
        byLandingPage:
          type: array
          description: Landing Page → Creative → Campaign → Platform rollup, scoped to this campaign's pages.
          items:
            type: object
            properties:
              landingPageId: { type: string }
              landingPageName: { type: string }
              views: { type: integer }
              uniqueSessions: { type: integer }
              submissions: { type: integer }
              conversionRate: { type: number, nullable: true }
              leads: { type: integer }
              sales: { type: integer }

    # ---------- Landing Pages ----------
    LandingPageTemplate:
      type: object
      required: [id, isSystem, name, formatVersion, schema, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string, nullable: true, description: "null = system template, shippable by a future external catalog." }
        isSystem: { type: boolean }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        formatVersion: { type: string }
        previewImageUrl: { type: string, nullable: true }
        schema:
          type: object
          additionalProperties: true
          description: >
            { sections: [{ key, type, order, hideable, editable: string[] }], themeTokens: string[] } —
            a structured manifest of what an author may edit, not markup. Versioned by formatVersion,
            independent of LOOPIE's own release, so an external template catalog can supply one LOOPIE imports.
        createdAt: { type: string, format: date-time }

    LandingPage:
      type: object
      required: [id, businessId, templateId, name, slug, status, content, formStartCount, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        templateId: { type: string }
        formId: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        customDomain: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        content:
          type: object
          additionalProperties: true
          description: Draft working copy, shaped per the template's schema.
        theme: { type: object, nullable: true, additionalProperties: true }
        publishedVersionId: { type: string, nullable: true }
        hostedUrl: { type: string, description: "LOOPIE-hosted URL — GET /p/{slug}." }
        formStartCount: { type: integer, description: "Approximate — not deduplicated by session." }
        createdAt: { type: string, format: date-time }

    CreateLandingPageInput:
      type: object
      required: [templateId, name, slug]
      properties:
        templateId: { type: string }
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        formId: { type: string }
        content: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }

    UpdateLandingPageInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        customDomain: { type: string, nullable: true }
        formId: { type: string, nullable: true }
        content: { type: object, additionalProperties: true }
        theme: { type: object, nullable: true, additionalProperties: true }

    PublishedPageVersion:
      type: object
      required: [id, landingPageId, version, content, publishedAt]
      properties:
        id: { type: string }
        landingPageId: { type: string }
        version: { type: integer }
        content: { type: object, additionalProperties: true }
        theme: { type: object, nullable: true, additionalProperties: true }
        formId: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }

    LandingPageExport:
      type: object
      required: [filename, html]
      properties:
        filename: { type: string }
        html: { type: string, description: "Self-contained, downloadable HTML page." }

    LandingPagePerformance:
      type: object
      properties:
        views: { type: integer }
        uniqueSessions: { type: integer }
        formStarts: { type: integer }
        submissions: { type: integer }
        conversionRate: { type: number, nullable: true, description: "submissions / uniqueSessions" }
        leads: { type: integer }
        sales: { type: integer }
        revenue: { type: number }

    SubmitLandingPageFormInput:
      type: object
      required: [data]
      properties:
        sessionId: { type: string, description: Anonymous session id captured by the hosted page. }
        data:
          type: object
          additionalProperties: true
          description: Field values keyed by FormField.fieldKey.
        utmSource: { type: string }
        utmMedium: { type: string }
        utmCampaign: { type: string }
        utmContent: { type: string }
        utmTerm: { type: string }

    SubmitLandingPageFormResult:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string }
        contactId: { type: string, nullable: true }
        leadId: { type: string, nullable: true }
        successMessage: { type: string, nullable: true }

    # ---------- Forms ----------
    FormFieldSchema:
      type: object
      required: [label, fieldKey, type]
      properties:
        id: { type: string }
        label: { type: string }
        fieldKey: { type: string, pattern: '^[a-z0-9_]+$' }
        type: { type: string, enum: [TEXT, EMAIL, PHONE, TEXTAREA, SELECT, CHECKBOX, HIDDEN] }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }
          nullable: true
        order: { type: integer, default: 0 }

    Form:
      type: object
      required: [id, businessId, name, submitLabel, fields, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        submitLabel: { type: string }
        successMessage: { type: string, nullable: true }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormFieldSchema' }
        createdAt: { type: string, format: date-time }

    CreateFormInput:
      type: object
      required: [name, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        submitLabel: { type: string }
        successMessage: { type: string }
        fields:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FormFieldSchema' }

    UpdateFormInput:
      type: object
      properties:
        name: { type: string }
        submitLabel: { type: string }
        successMessage: { type: string, nullable: true }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormFieldSchema' }

    FormSubmission:
      type: object
      required: [id, businessId, formId, data, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        formId: { type: string }
        landingPageId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        leadId: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
        sessionId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------- Ad Units (first-party) ----------
    AdUnit:
      type: object
      required: [id, businessId, campaignId, creativeId, format, status, impressions, clicks, conversions, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        campaignId: { type: string }
        creativeId: { type: string }
        format: { type: string, enum: [DISPLAY_BANNER, NATIVE, EMBED] }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl: { type: string, nullable: true }
        servingConfig: { type: object, nullable: true, additionalProperties: true }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        lastServedAt: { type: string, format: date-time, nullable: true }
        serveUrl:
          type: string
          description: Ad-server embed endpoint for this unit (apps/ad-server — a separate deployable service).
        createdAt: { type: string, format: date-time }

    CreateAdUnitInput:
      type: object
      required: [campaignId, creativeId, format]
      properties:
        campaignId: { type: string }
        creativeId: { type: string }
        format: { type: string, enum: [DISPLAY_BANNER, NATIVE, EMBED] }
        destinationLandingPageId: { type: string }
        destinationUrl: { type: string }
        servingConfig: { type: object, additionalProperties: true }

    UpdateAdUnitInput:
      type: object
      properties:
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        destinationLandingPageId: { type: string, nullable: true }
        destinationUrl: { type: string, nullable: true }
        servingConfig: { type: object, additionalProperties: true }

    # ---------- Lead / Sale / Interaction ----------
    Lead:
      type: object
      required: [id, businessId, contactId, stage, sourceType, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        contactId: { type: string }
        stage: { type: string, enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST] }
        owner: { type: string, nullable: true }
        estimatedValue: { type: number, nullable: true }
        sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_UNIT, MANUAL, IMPORT] }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        clickId: { type: string, nullable: true }
        landingSessionId: { type: string, nullable: true }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UpdateLeadInput:
      type: object
      properties:
        stage: { type: string, enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST] }
        owner: { type: string, nullable: true }
        estimatedValue: { type: number, nullable: true }

    Sale:
      type: object
      required: [id, businessId, contactId, amount, date, sourceType, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        contactId: { type: string }
        leadId: { type: string, nullable: true }
        amount: { type: number }
        date: { type: string, format: date-time }
        productOrService: { type: string, nullable: true }
        sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_UNIT, MANUAL, IMPORT] }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateSaleInput:
      type: object
      required: [contactId, amount, date]
      properties:
        contactId: { type: string }
        leadId: { type: string }
        amount: { type: number, minimum: 0 }
        date: { type: string, format: date-time }
        productOrService: { type: string }
        notes: { type: string }

    Interaction:
      type: object
      required: [id, contactId, type, occurredAt]
      properties:
        id: { type: string }
        contactId: { type: string }
        type:
          type: string
          enum: [EMAIL_SENT, TEXT_SENT, SOCIAL_POST_SENT, REPLY, CALL_LOGGED, NOTE, STATUS_CHANGE, QUOTE_SENT, SALE_RECORDED, AD_CLICK, FORM_SUBMITTED, PAGE_VIEWED]
        sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_UNIT, MANUAL, IMPORT], nullable: true }
        sourceMessageId: { type: string, nullable: true }
        sourceDeploymentId: { type: string, nullable: true }
        sourceAdUnitId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        occurredAt: { type: string, format: date-time }

    # ---------- Attribution ----------
    SubmitFormInput:
      type: object
      required: [sessionId, name]
      properties:
        sessionId: { type: string, description: Anonymous session id captured by the website tracker. }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string }

    SubmitFormResult:
      type: object
      properties:
        contactId: { type: string }
        leadId: { type: string }

    # ---------- Dashboards ----------
    HomeSummary:
      type: object
      properties:
        newLeads: { type: integer }
        unansweredReplies: { type: integer }
        followUpsDue: { type: integer }
        failedSends: { type: integer }
        automationErrors: { type: integer }

    ResultsSummary:
      type: object
      properties:
        totalSpend: { type: number }
        totalLeads: { type: integer }
        totalSales: { type: integer }
        totalRevenue: { type: number }
        blendedCpl: { type: number, nullable: true }
        funnel:
          type: object
          properties:
            views: { type: integer }
            clicks: { type: integer }
            leads: { type: integer }
            sales: { type: integer }
        bySource:
          type: array
          items:
            type: object
            properties:
              sourceType: { type: string, enum: [MESSAGE, DEPLOYMENT, AD_UNIT] }
              sourceId: { type: string }
              label: { type: string }
              leads: { type: integer }
              sales: { type: integer }
              revenue: { type: number }
              spend: { type: number, nullable: true }

paths:
  # ---------- Auth ----------
  /auth/register:
    post:
      operationId: register
      summary: Register
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/login:
    post:
      operationId: login
      summary: Login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      tags: [auth]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  # ---------- Contacts ----------
  /contacts:
    get:
      operationId: listContacts
      summary: List contacts
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: lifecycleStatus
          schema: { type: string, enum: [LEAD, CUSTOMER, PAST_CUSTOMER, NONE] }
      responses:
        '200':
          description: Paginated contacts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createContact
      summary: Create contact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactInput' }
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }

  /contacts/import:
    post:
      operationId: importContacts
      summary: Import contacts
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportContactsInput' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportContactsResult' }

  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Get contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    patch:
      operationId: updateContact
      summary: Update contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactInput' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    delete:
      operationId: deleteContact
      summary: Delete contact
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }

  /contacts/{contactId}/interactions:
    get:
      operationId: listContactInteractions
      summary: List contact interactions
      tags: [contacts]
      parameters:
        - $ref: '#/components/parameters/ContactId'
