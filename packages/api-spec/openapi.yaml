  # ---------- Inbox ----------
  # Deliberately narrow per the Messages -> Inbox slice (2026-08-28): no archive, no saved/default
  # views, no filters beyond all/unread, no send/reply here yet (that's a later slice once
  # email/SMS transport is connected — compose still lives at POST /messages/{id}/send).
  /inbox/threads:
    get:
      operationId: listInboxThreads
      summary: List Inbox threads
      description: >
        CONTACT and ADVERTISEMENT threads together, most-recent-activity first. A CONTACT
        thread's preview/messages are read live from Interaction joined back to Message — real
        communications are never copied into a second row (see InboxService's own doc comment).
        Known limitation: no inbound-reply capture exists yet, so CONTACT threads only ever show
        outbound sent messages.
      tags: [inbox]
      parameters:
        - in: query
          name: filter
          schema: { type: string, enum: [all, unread], default: all }
      responses:
        '200':
          description: Inbox threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InboxThreadSummary' }

  /inbox/threads/{threadId}:
    get:
      operationId: getInboxThread
      summary: Get an Inbox thread and its messages, chronological
      tags: [inbox]
      parameters:
        - $ref: '#/components/parameters/InboxThreadId'
      responses:
        '200':
          description: Thread and messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [thread, messages]
                    properties:
                      thread: { $ref: '#/components/schemas/InboxThreadSummary' }
                      messages:
                        type: array
                        items: { $ref: '#/components/schemas/InboxMessage' }

  /inbox/threads/{threadId}/read:
    post:
      operationId: markInboxThreadRead
      summary: Mark an Inbox thread read
      description: Sets the thread's read watermark to now. Thread-level only — no per-message read state.
      tags: [inbox]
      parameters:
        - $ref: '#/components/parameters/InboxThreadId'
      responses:
        '200':
          description: Updated thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InboxThreadSummary' }

