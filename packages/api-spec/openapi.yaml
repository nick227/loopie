      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkCommissionPayableInput' }
      responses:
        '200':
          description: Commission is now a payable liability on the ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Commission' }

  /finance/commissions/{commissionId}/cancel:
    post:
      operationId: cancelCommission
      summary: Cancel a pending commission
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      responses:
        '200':
